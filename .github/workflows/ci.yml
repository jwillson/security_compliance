# Everything that can be proven without a host, on every push and pull
# request (TASKS.md R6), the toolchain checks inside the control-plane image. Host behaviour is proven on the labs
# (nist_sp_800_171r3/rl9-171/docs/LAB.md); this proves the tool agrees with
# itself: the catalog reproduces from the PDF, the overlay, catalog and checks
# agree, the unit tests pass, the playbook and every script parse, and no
# secret has ever been committed.
#
# Actions are pinned to commit SHAs, not tags: a tag can be moved.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nist_sp_800_171r3/rl9-171
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # the secret scan reads every commit

      # Everything that needs the toolchain runs inside the control-plane
      # image (container/Containerfile: Ubuntu 26.04, pinned ansible-core and
      # collections), so CI tests exactly what ./nist gives an operator.
      - name: Build the control-plane image
        run: NIST_CONTAINER_RUNTIME=docker ./nist --rebuild true

      - name: The catalog, the overlay and the checks agree
        run: NIST_CONTAINER_RUNTIME=docker ./nist make validate

      - name: Unit tests (assessor, validator, POA&M register)
        run: NIST_CONTAINER_RUNTIME=docker ./nist make test

      - name: The catalog reproduces byte for byte from the PDF
        run: NIST_CONTAINER_RUNTIME=docker ./nist make catalog-check

      - name: The example inventory parses, and the playbooks with it
        # Ansible's YAML inventory plugin reads only .yml/.yaml/.json names, so
        # hosts.yml.example fell through to the INI parser and the syntax check
        # ran on an empty inventory (issue #14). A copy named .yml, and an
        # unparsed inventory is fatal.
        run: |
          NIST_CONTAINER_RUNTIME=docker ./nist bash -c '
            cp inventory/hosts.yml.example /tmp/hosts.yml
            export ANSIBLE_INVENTORY_UNPARSED_FAILED=true
            ansible-inventory -i /tmp/hosts.yml --graph | grep -q @cui_hosts
            ansible-playbook --syntax-check -i /tmp/hosts.yml site.yml
            ansible-playbook --syntax-check -i /tmp/hosts.yml rotate-luks-passphrase.yml'

      - name: No secret anywhere in the history
        run: tools/secret-scan.sh

      - name: Every script parses
        run: |
          set -e
          for f in $(git ls-files '*.sh' apply.sh verify.sh); do bash -n "$f"; done
          python3 -m py_compile $(git ls-files '*.py') audit/nist-assess

      - name: No shell script has an error shellcheck can see
        # Errors only: warnings are reviewed by hand, not gated here.
        run: shellcheck -S error $(git ls-files '*.sh') apply.sh verify.sh

  host-python:
    # Python 3.9 is Rocky 9's /usr/bin/python3: the assessor, the POA&M merge
    # and the check commands run under it on every hardened host. (The
    # workstation side runs only in the control-plane image, TASKS C2.) CI
    # tested only 3.12, so code that parses only on 3.12 went unnoticed
    # (issue #14).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nist_sp_800_171r3/rl9-171
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.9"
      - name: Every Python file parses, and every test passes, on Python 3.9
        run: |
          pip install --quiet pyyaml==6.0.3
          python --version | grep -q '^Python 3\.9' || { python --version; echo "not 3.9" >&2; exit 1; }
          python -m py_compile $(git ls-files '*.py') audit/nist-assess
          python -m unittest discover -s tests
