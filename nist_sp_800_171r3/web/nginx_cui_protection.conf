server {
    listen 443 ssl http2;
    server_name cui.yourdomain.com;

    # 1. Transmission and Storage Confidentiality (03.13.08)
    # Use only TLS 1.2 and 1.3
    ssl_protocols TLSv1.2 TLSv1.3;

    # 2. Cryptographic Protection (03.13.11)
    # NOTE: CHACHA20-POLY1305 is NOT FIPS 140-3 approved. Drop the two
    # CHACHA20 suites below on a host running in FIPS mode, or let
    # crypto-policies own the list instead of setting it here.
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;

    # 3. Session Authenticity (03.13.15)
    # HSTS ensures browsers only connect via HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 4. Browser hardening headers. These map to no single 800-171r3
    # requirement — they are defense in depth for the application tier, not
    # evidence for any control. Do not cite them in the SSP.
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    ssl_certificate /etc/pki/tls/certs/cui_site.crt;
    ssl_certificate_key /etc/pki/tls/private/cui_site.key;

    location / {
        proxy_pass http://internal_app;
    }
}
