server {
    listen 443 ssl http2;
    server_name cui.yourdomain.com;

    # 1. Transmission Confidentiality (03.13.08)
    # Use only TLS 1.2 and 1.3
    ssl_protocols TLSv1.2 TLSv1.3;

    # 2. Strong Cipher Suites (FIPS Approved)
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;

    # 3. Session Authenticity (03.13.11)
    # HSTS ensures browsers only connect via HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 4. Secure Headers to prevent Information Leakage (03.14.03)
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    ssl_certificate /etc/pki/tls/certs/cui_site.crt;
    ssl_certificate_key /etc/pki/tls/private/cui_site.key;

    location / {
        proxy_pass http://internal_app;
    }
}
