---
# Receive forwarded audit records (03.03.05c, correlation across
# repositories) and protect them once received (03.03.08).
#
# This role runs *after* nist_800_171 on the same host: a collector holds
# other systems' audit records, so it is a CUI host by any reading and gets
# the full overlay first. This adds only the receiving half.
#
# Records land in /var/log/nist-remote/<hostname>/, which is on the separate
# /var/log filesystem the kickstart creates, so a flood of forwarded records
# cannot fill the root filesystem.

- name: Ensure the remote record directory exists
  ansible.builtin.file:
    path: "{{ nist_remote_log_dir }}"
    state: directory
    owner: root
    group: root
    # 0700: forwarded records are audit information under 03.03.08a and must
    # be no more readable here than they were on the host that sent them.
    mode: "0700"
  tags: ["03.03.05", "03.03.08"]

- name: Read this host's certificate for the TLS listener
  ansible.builtin.set_fact:
    nist_col_ca:   "{{ lookup('file', nist_pki_dir + '/ca.crt', errors='ignore') or '' }}"
    nist_col_cert: "{{ lookup('file', nist_pki_dir + '/' + inventory_hostname + '.crt', errors='ignore') or '' }}"
    nist_col_key:  "{{ lookup('file', nist_pki_dir + '/' + inventory_hostname + '.key', errors='ignore') or '' }}"
  no_log: true
  tags: ["03.03.05", "03.13.08"]

- name: Note whether the TLS listener can be configured
  ansible.builtin.set_fact:
    nist_col_tls_ready: >-
      {{ nist_log_tls and nist_col_ca | length > 0
         and nist_col_cert | length > 0 and nist_col_key | length > 0 }}
    # Every forwarder in the inventory, by the name its certificate carries.
    # Sorted: `difference` does not keep an order, so with two forwarders the
    # list came out either way round, rewrote the config and restarted the
    # collector's rsyslog on every run (DEFECTS 6b.9).
    nist_col_peers: "{{ groups['cui_hosts'] | default([]) | difference([inventory_hostname]) | sort }}"
  tags: ["03.03.05", "03.13.08"]

- name: Warn that the collector cannot listen for lack of certificates
  ansible.builtin.debug:
    msg: >-
      nist_log_tls is true but {{ nist_pki_dir }} does not hold ca.crt,
      {{ inventory_hostname }}.crt and {{ inventory_hostname }}.key, so no
      listener is configured. Supply them (make pki for the lab) and
      re-apply; until then every forwarder reports its connection as not
      established.
  when: nist_log_tls and not nist_col_tls_ready
  tags: ["03.03.05", "03.13.08"]

- name: Install the rsyslog TLS driver
  ansible.builtin.dnf:
    name: rsyslog-openssl
    state: present
  when: nist_col_tls_ready
  tags: ["03.03.05", "03.13.08"]

- name: Ensure the rsyslog certificate directory exists
  ansible.builtin.file:
    path: /etc/pki/rsyslog
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: nist_col_tls_ready
  tags: ["03.03.05", "03.13.08"]

- name: Install the listener certificates
  ansible.builtin.copy:
    content: "{{ item.content }}\n"
    dest: "/etc/pki/rsyslog/{{ item.name }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { name: ca.crt,   content: "{{ nist_col_ca }}",   mode: "0644" }
    - { name: host.crt, content: "{{ nist_col_cert }}", mode: "0644" }
    - { name: host.key, content: "{{ nist_col_key }}",  mode: "0600" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: nist_col_tls_ready
  notify: restart rsyslog collector
  tags: ["03.03.05", "03.13.08"]

- name: Configure rsyslog to receive forwarded records
  ansible.builtin.template:
    src: rsyslog-collector.conf.j2
    dest: /etc/rsyslog.d/10-nist-collector.conf
    owner: root
    group: root
    mode: "0600"
    validate: "rsyslogd -N1 -f %s"
  when: nist_col_tls_ready or not nist_log_tls
  notify: restart rsyslog collector
  tags: ["03.03.05"]

- name: Remove a listener that can no longer be honoured
  ansible.builtin.file:
    path: /etc/rsyslog.d/10-nist-collector.conf
    state: absent
  when: nist_log_tls and not nist_col_tls_ready
  notify: restart rsyslog collector
  tags: ["03.03.05"]

- name: Rotate the received records at the audit retention ODP
  ansible.builtin.template:
    src: logrotate-collector.j2
    dest: /etc/logrotate.d/nist-remote
    owner: root
    group: root
    mode: "0644"
  tags: ["03.03.05", "03.03.03"]

- name: Allow the forwarding port from the enclave only
  ansible.posix.firewalld:
    port: "{{ nist_collector_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
    zone: "{{ nist_collector_zone }}"
  # firewalld, and the python library this module needs, come from the
  # overlay's 03.13.01 tasks in the play before. In check mode on a host that
  # has never had them that install does not happen, and the dry run failed
  # here (DEFECTS 6b.11); the overlay's idiom (roles/nist_800_171/tasks/main.yml).
  when: not (ansible_check_mode and (nist_firewalld_pkg | default({})) is changed)
  tags: ["03.03.05", "03.13.01"]

- name: Let SELinux bind rsyslog to the forwarding port
  # syslogd_port_t already covers 514/tcp on a stock policy; this is here for
  # the case where nist_collector_port has been changed to something else.
  community.general.seport:
    ports: "{{ nist_collector_port }}"
    proto: tcp
    setype: syslogd_port_t
    state: present
  failed_when: false
  tags: ["03.03.05"]

- name: Declare the forwarding port as authorized on this host
  # 03.04.06 / 03.13.06 treat an undeclared listener as a deviation. This is
  # where 514 becomes legitimate - on the collector only, and only because
  # the role that opened it said so. The checks read this directory; they do
  # not have 514 written into them.
  ansible.builtin.copy:
    dest: "{{ nist_conf_dir }}/authorized-ports.d/10-collector"
    content: |
      # Authorized by roles/nist_log_collector: rsyslog receives forwarded
      # audit records here (03.03.05c).
      {{ nist_collector_port }}
    owner: root
    group: root
    mode: "0644"
  tags: ["03.03.05", "03.04.06", "03.13.06"]

- name: Record what this host collects
  ansible.builtin.copy:
    dest: "{{ nist_conf_dir }}/log-collector-status"
    content: |
      # 03.03.05c Audit record correlation - receiving side
      status={{ 'collector' if (nist_col_tls_ready or not nist_log_tls) else 'tls-certificate-missing' }}
      port={{ nist_collector_port }}/tcp
      transport={{ 'tls' if nist_col_tls_ready else 'plain' }}
      directory={{ nist_remote_log_dir }}
      retention_days={{ odp.audit_retention_days }}
    owner: root
    group: root
    mode: "0644"
  tags: ["03.03.05"]
