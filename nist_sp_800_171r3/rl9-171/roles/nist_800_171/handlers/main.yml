---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: restart logind
  # systemd 252 supports restarting logind under live sessions; the apply's
  # own SSH session carried on through it on byo-rl9-01 (issue #9).
  ansible.builtin.systemd:
    name: systemd-logind
    state: restarted

- name: restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted

- name: restart chronyd
  ansible.builtin.systemd:
    name: chronyd
    state: restarted

- name: restart firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: restarted

- name: restart fapolicyd
  ansible.builtin.systemd:
    name: fapolicyd
    state: restarted

- name: restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

# auditd refuses `systemctl restart` by design; the service file sets
# RefuseManualStop. Use its own control path instead.
- name: restart auditd
  ansible.builtin.command:
    cmd: /usr/sbin/service auditd restart
  changed_when: true

- name: regenerate audit rules
  # With `-e 2` already loaded, the rules are immutable until reboot. That is
  # the desired end state (03.03.08a), so a refusal here is not a failure - it
  # means protection is already active. The new rules load on next boot.
  #
  # `--check` is run straight after because augenrules reports what happened
  # on stdout, not through its exit status - see the next handler.
  ansible.builtin.shell: |
    /sbin/augenrules --load 2>&1 || true
    /sbin/augenrules --check 2>&1 || true
  register: nist_augenrules
  changed_when: true
  failed_when: false
  notify: flag reboot for audit rules

- name: flag reboot for audit rules
  # augenrules exits 0 whatever happens. It exits 0 having loaded the rules,
  # and it exits 0 again having loaded nothing because the configuration is
  # already immutable. Gating on its return code therefore reports "no reboot
  # required" on exactly the host that needs one - a freshly hardened host,
  # where `-e 2` is applied in the same run that writes the rules, so
  # 11-loginuid.rules never reaches /etc/audit/audit.rules and
  # ia-01-loginuid-immutable fails until the next boot.
  #
  # Only stdout distinguishes the cases:
  #   loaded     -> (nothing of interest)
  #   refused    -> "Audit system is in immutable mode - exiting with no changes"
  #   pending    -> "Rules have changed and should be updated"
  #   up to date -> "No change"
  #
  # Only the "pending" message is used. "immutable mode" is tempting and
  # wrong: it appears every time this handler runs on any locked host, so
  # rewriting a rules file with identical content - which needs no reboot at
  # all - would report that one is required. `--check` is the narrower
  # question, and the right one: does what is on disk differ from what is
  # compiled and loaded? Only then is a reboot owed.
  ansible.builtin.set_fact:
    nist_reboot_required: true
  when: >-
    nist_augenrules.rc | default(0) != 0
    or 'Rules have changed' in (nist_augenrules.stdout | default(''))

- name: apply authselect changes
  ansible.builtin.command:
    cmd: authselect apply-changes -b
  changed_when: true

- name: rebuild fapolicyd trust database
  ansible.builtin.command:
    cmd: fapolicyd-cli --update
  changed_when: true
