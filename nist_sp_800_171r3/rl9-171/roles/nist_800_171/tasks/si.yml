---
# 03.14 SYSTEM AND INFORMATION INTEGRITY

# ===========================================================================
# 03.14.01 Flaw Remediation
# ===========================================================================
- name: "03.14.01 | Install the automatic update mechanism"
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present
  register: nist_dnf_automatic_pkg
  tags: ["03.14.01"]

- name: "03.14.01 | Apply security updates automatically"
  ansible.builtin.template:
    src: dnf-automatic.conf.j2
    dest: /etc/dnf/automatic.conf
    owner: root
    group: root
    mode: "0644"
  tags: ["03.14.01"]

- name: "03.14.01 | Run the updater well inside the ODP patch window"
  ansible.builtin.copy:
    dest: /etc/systemd/system/dnf-automatic.timer.d/nist-override.conf
    content: |
      # 03.14.01b  The organizational ODP patch_sla sets the window
      # ({{ (odp_organizational | selectattr('id', 'eq', 'patch_sla') | map(attribute='value') | first) }});
      # checking daily leaves ample margin for any value it takes.
      [Timer]
      OnCalendar=
      OnCalendar=*-*-* 01:00:00
      RandomizedDelaySec=900
      Persistent=true
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd
  tags: ["03.14.01"]

- name: "03.14.01 | Enable the automatic update timer"
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    enabled: true
    state: started
    daemon_reload: true
  # The timer ships with the package; check mode cannot install it.
  when: not (ansible_check_mode and (nist_dnf_automatic_pkg | default({})) is changed)
  tags: ["03.14.01"]

- name: "03.14.01 | Apply outstanding security updates now"
  ansible.builtin.dnf:
    name: "*"
    state: latest
    security: true
    update_cache: true
  register: nist_sec_updates
  tags: ["03.14.01"]

- name: "03.14.01 | Flag a reboot if the kernel or core libraries changed"
  ansible.builtin.set_fact:
    nist_reboot_required: true
  when: nist_sec_updates.changed
  tags: ["03.14.01"]

# ===========================================================================
# 03.14.02 Malicious Code Protection
# ===========================================================================
- name: "03.14.02 | Enable EPEL, which is where ClamAV comes from"
  # Recorded as an authorized repository only when the operator has opted in;
  # see the note on nist_clamav_enabled in defaults/main.yml.
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: nist_clamav_enabled and nist_enable_epel
  failed_when: false
  tags: ["03.14.02"]

- name: "03.14.02 | Install ClamAV"
  ansible.builtin.dnf:
    name:
      - clamav
      - clamav-update
      - clamd
    state: present
  when: nist_clamav_enabled
  register: nist_clamav_install
  failed_when: false
  tags: ["03.14.02"]

- name: "03.14.02 | Record the malicious code protection posture"
  ansible.builtin.copy:
    dest: "{{ nist_conf_dir }}/malicious-code.conf"
    content: |
      # 03.14.02  Malicious code protection mechanisms on this host.
      # fapolicyd is the preventive control and is always present; ClamAV adds
      # signature-based detection and requires EPEL.
      prevention=fapolicyd:{{ 'enforcing' if nist_fapolicyd_enabled else 'disabled' }}
      signature_scanning={{ 'clamav' if nist_clamav_enabled else 'not installed (EPEL not authorized)' }}
      quarantine=/var/lib/nist-quarantine
    owner: root
    group: root
    mode: "0644"
  tags: ["03.14.02"]

- name: "03.14.02 | Allow freshclam to update signatures"
  ansible.builtin.lineinfile:
    path: /etc/freshclam.conf
    regexp: '^\s*Example\s*$'
    line: "# Example  (commented by the NIST 800-171 role)"
  when: nist_clamav_enabled and nist_clamav_install is succeeded
  failed_when: false
  tags: ["03.14.02"]

- name: "03.14.02 | Fetch signatures now"
  ansible.builtin.command:
    cmd: freshclam --quiet
  when: nist_clamav_enabled and nist_clamav_install is succeeded
  register: nist_freshclam
  changed_when: nist_freshclam.rc == 0
  failed_when: false
  tags: ["03.14.02"]

- name: "03.14.02 | Keep signatures current"
  ansible.builtin.systemd:
    name: clamav-freshclam
    enabled: true
    state: started
  when: nist_clamav_enabled and nist_clamav_install is succeeded
  failed_when: false
  tags: ["03.14.02"]

- name: "03.14.02 | Install the scheduled malicious code scan"
  ansible.builtin.template:
    src: clamav-scan.sh.j2
    dest: "{{ nist_bin_dir }}/nist-malware-scan"
    owner: root
    group: root
    mode: "0750"
  when: nist_clamav_enabled
  tags: ["03.14.02"]

- name: "03.14.02 | Schedule the malicious code scan at the ODP frequency"
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: nist-malware-scan.service
      content: |
        [Unit]
        Description=NIST 800-171r3 03.14.02 malicious code scan

        [Service]
        Type=oneshot
        Nice=19
        IOSchedulingClass=idle
        ExecStart={{ nist_bin_dir }}/nist-malware-scan
    - name: nist-malware-scan.timer
      content: |
        [Unit]
        Description=NIST 800-171r3 malicious code scan schedule

        [Timer]
        OnCalendar={{ nist_clamav_scan_schedule }}
        Persistent=true

        [Install]
        WantedBy=timers.target
  when: nist_clamav_enabled
  notify: reload systemd
  tags: ["03.14.02"]

- name: "03.14.02 | Enable the malicious code scan timer"
  ansible.builtin.systemd:
    name: nist-malware-scan.timer
    enabled: true
    state: started
    daemon_reload: true
  when: nist_clamav_enabled
  failed_when: false
  tags: ["03.14.02"]

- name: "03.14.02 | Create the quarantine directory"
  ansible.builtin.file:
    path: /var/lib/nist-quarantine
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: ["03.14.02"]

# ===========================================================================
# 03.14.03 Security Alerts, Advisories, and Directives
# ===========================================================================
- name: "03.14.03 | Enable the errata metadata feed"
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^\s*metadata_expire\s*='
    line: "metadata_expire=6h"
    create: true
    owner: root
    group: root
    mode: "0644"
  tags: ["03.14.03"]

- name: "03.14.03 | Route internal alerts to the responder mailbox"
  ansible.builtin.copy:
    dest: "{{ nist_conf_dir }}/alerting.conf"
    content: |
      # 03.14.03b  Internal security alerts, advisories and directives.
      # Consumed by nist-aide-check, nist-audit-review and nist-assess.
      ALERT_MAIL={{ nist_alert_mail }}
      ALERT_SYSLOG_FACILITY=authpriv
      ALERT_SYSLOG_TAG=nist-800-171
    owner: root
    group: root
    mode: "0644"
  tags: ["03.14.03"]

# ===========================================================================
# 03.14.06 System Monitoring
# ===========================================================================
# The auditd rule set (deployed in ac.yml) carries the monitoring rules for
# attacks, unauthorized connections, and unauthorized use. firewalld LogDenied
# is set in sc.yml. AIDE scheduling is in cm.yml. This task records the
# assembled monitoring posture for the assessor.
- name: "03.14.06 | Record the monitoring posture"
  ansible.builtin.copy:
    dest: "{{ nist_conf_dir }}/monitoring.conf"
    content: |
      # 03.14.06 / 03.12.03  System monitoring components on this host.
      attack_detection=auditd:unauthorized_access,privileged_exec,module_load
      unauthorized_connections=firewalld:LogDenied=all
      unauthorized_use=auditd:identity,logins,session
      integrity_monitoring=aide:nist-aide-check.timer
      malicious_code=clamav:nist-malware-scan.timer,fapolicyd
      vulnerability=openscap:nist-vuln-scan.timer
      assessment=nist-assess:nist-assessment.timer
    owner: root
    group: root
    mode: "0644"
  tags: ["03.14.06", "03.12.03"]

# ===========================================================================
# 03.14.08 Information Management and Retention
# ===========================================================================
- name: "03.14.08 | Give journald bounded persistent retention"
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/80-nist.conf
    content: |
      # 03.14.08 / 03.06.02  Retain system records for the ODP period.
      [Journal]
      Storage=persistent
      Compress=yes
      SystemMaxUse=2G
      MaxRetentionSec={{ odp.audit_retention_days }}day
      MaxFileSec=1day
      ForwardToSyslog=yes
      # 03.03.08a  Journal files are not readable by ordinary users.
      SystemMaxFileSize=128M
    owner: root
    group: root
    mode: "0644"
  notify: restart journald
  tags: ["03.14.08", "03.06.02"]

- name: "03.14.08 | Retain and protect the general system logs"
  ansible.builtin.copy:
    dest: /etc/logrotate.d/nist-syslog
    content: |
      # 03.14.08  Retain system logs for {{ odp.audit_retention_days }} days
      # with restrictive permissions (03.03.08a).
      /var/log/messages /var/log/secure /var/log/maillog /var/log/cron /var/log/sudo.log {
          rotate {{ (odp.audit_retention_days | int / 7) | round | int }}
          weekly
          maxage {{ odp.audit_retention_days }}
          missingok
          notifempty
          compress
          delaycompress
          create 0600 root root
          sharedscripts
          postrotate
              /usr/bin/systemctl kill -s HUP rsyslog.service 2>/dev/null || true
          endscript
      }
    owner: root
    group: root
    mode: "0644"
  tags: ["03.14.08"]

- name: "03.14.08 | Set restrictive permissions on new log files"
  ansible.builtin.lineinfile:
    path: /etc/rsyslog.conf
    regexp: '^\$FileCreateMode'
    line: "$FileCreateMode 0600"
    insertafter: '^#### GLOBAL DIRECTIVES ####'
  notify: restart rsyslog
  tags: ["03.14.08", "03.03.08"]

- name: "03.14.08 | Keep login records private across reboots"
  # systemd-tmpfiles recreates wtmp, btmp and lastlog with world-readable modes
  # on every boot, silently undoing a one-off chmod. An /etc/tmpfiles.d entry
  # takes precedence over the vendor one and makes the mode stick.
  # These files are audit information under 03.03.08a; `last` and `lastlog`
  # consequently require root on this host.
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/nist-800-171-logs.conf
    content: |
      # 03.03.08a / 03.14.08  Login records are readable only by root.
      f /var/log/wtmp    0600 root utmp -
      f /var/log/btmp    0600 root utmp -
      f /var/log/lastlog 0600 root root -
    owner: root
    group: root
    mode: "0644"
  register: nist_tmpfiles
  tags: ["03.14.08", "03.03.08", "03.06.02"]

- name: "03.14.08 | Apply the login record permissions now"
  ansible.builtin.command:
    cmd: systemd-tmpfiles --create /etc/tmpfiles.d/nist-800-171-logs.conf
  when: nist_tmpfiles is changed
  changed_when: true
  failed_when: false
  tags: ["03.14.08", "03.03.08", "03.06.02"]

- name: "03.14.08 | Tighten permissions on existing log files"
  # A log file may be read by root and nobody else. That is 0600, or 0640
  # with group root, which exposes nothing further: firewalld reopens
  # /var/log/firewalld as 0640 root:root on every start (os.fchmod in its
  # logger), so chmod-ing it to 0600 here was undone by the next boot and
  # redone by the next apply. Anything readable by another group or by
  # others is tightened. The old test, "numeric mode greater than 600",
  # also let a 0440 file owned by a service group through.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      changed=0
      while read -r f; do
        [ -f "$f" ] || continue
        read -r mode group <<<"$(stat -c '%a %G' "$f")"
        gopl=$(( 8#$mode & 8#077 ))          # group + other bits
        [ "$gopl" -eq 0 ] && continue
        if [ "$group" = root ] && [ $(( gopl & 8#037 )) -eq 0 ]; then
          continue                          # group read only, group root
        fi
        chmod 0600 "$f"; changed=1
      done < <(find /var/log -maxdepth 1 -type f)
      echo "changed=$changed"
    executable: /bin/bash
  register: nist_logperms
  changed_when: "'changed=1' in nist_logperms.stdout"
  tags: ["03.14.08", "03.03.08", "03.06.02"]
