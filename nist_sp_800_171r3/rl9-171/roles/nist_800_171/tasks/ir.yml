---
# 03.06 INCIDENT RESPONSE
#
# Only 03.06.02 has a host-enforceable component. The journald retention and
# log permissions it needs are applied with 03.14.08 in si.yml; this file adds
# the pieces specific to incident monitoring.

- name: "03.06.02 | Ensure the journal directory exists and is persistent"
  # Existence is what makes journald persist (Storage=auto). The mode matches
  # systemd's own tmpfiles entry (`z /var/log/journal 2755 root
  # systemd-journal`), which is reapplied at every boot: the 2750 this task
  # used to set was reverted by the next reboot and re-set by the next apply,
  # for nothing - the per-machine directory below is 2750 by the same vendor
  # rules and the journal files are 0640, so the top directory exposes only
  # the machine-id name.
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  notify: restart journald
  tags: ["03.06.02"]

- name: "03.06.02 | Record the incident reporting path"
  ansible.builtin.copy:
    dest: "{{ nist_conf_dir }}/incident-reporting.conf"
    content: |
      # 03.06.02b/c  Where suspected incidents are reported.
      # The host generates the telemetry; reporting to the organizational
      # incident response capability and to external authorities is a process.
      incident_mail={{ nist_alert_mail }}
      log_collector={{ nist_log_collector | default('(none configured)', true) }}
      telemetry=auditd,journald,aide,clamav,firewalld
    owner: root
    group: root
    mode: "0644"
  tags: ["03.06.02"]
