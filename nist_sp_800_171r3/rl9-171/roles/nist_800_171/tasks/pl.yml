---
# 03.15 PLANNING

# ===========================================================================
# 03.15.02 System Security Plan
# ===========================================================================
- name: "03.15.02 | Install the SSP generator"
  ansible.builtin.template:
    src: generate-ssp.sh.j2
    dest: "{{ nist_bin_dir }}/nist-generate-ssp"
    owner: root
    group: root
    mode: "0750"
  tags: ["03.15.02"]

- name: "03.15.02 | Create the directory for the owner's SSP sections"
  ansible.builtin.file:
    path: "{{ nist_conf_dir }}/ssp.d"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: ["03.15.02"]

- name: "03.15.02 | Install the owner's SSP sections from NIST_SSP_DIR"
  ansible.builtin.copy:
    src: "{{ nist_ssp_dir }}/{{ item }}"
    dest: "{{ nist_conf_dir }}/ssp.d/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop: [02-information-types.md, 03-threats.md, 07-roles.md]
  when: nist_ssp_dir | length > 0 and (nist_ssp_dir ~ '/' ~ item) is file
  tags: ["03.15.02"]

- name: "03.15.02 | Generate the SSP"
  # A regenerated document, not a configuration change - see the note on the
  # inventory generator in cm.yml.
  ansible.builtin.command:
    cmd: "{{ nist_bin_dir }}/nist-generate-ssp"
  changed_when: false
  failed_when: false
  tags: ["03.15.02"]

- name: "03.15.02 | Protect the system security plan"
  # 03.15.02c  The SSP describes the safeguards in place and is itself
  # sensitive; it is readable only by root.
  ansible.builtin.file:
    path: "{{ nist_conf_dir }}/system-security-plan.md"
    owner: root
    group: root
    mode: "0600"
  failed_when: false
  tags: ["03.15.02"]
