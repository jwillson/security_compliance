---
# Requirement families, applied in dependency order.
#
# Every task carries its requirement ID as a tag, so `--tags 03.05.07` applies
# exactly the tasks that implement Password Management and nothing else. The
# family tag (`--tags 03.05`) selects the whole family.

- name: Prepare the toolkit directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ nist_conf_dir }}"
    - "{{ nist_lib_dir }}"
    - "{{ nist_report_dir }}"
  tags: [always]

- name: Ensure the drop-in directories the role writes into exist
  # A minimal Rocky 9 install ships several of these only when the owning
  # package creates them, so they are established up front rather than being
  # discovered one failure at a time.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/systemd/coredump.conf.d
    - /etc/systemd/journald.conf.d
    - /etc/systemd/system/dnf-automatic.timer.d
    - /etc/security/limits.d
    - /etc/modprobe.d
    - /etc/sysctl.d
    - /etc/rsyslog.d
    - /etc/ssh/sshd_config.d
    - /etc/ssh/ssh_config.d
    - /etc/dconf/db/gdm.d
    - /etc/fapolicyd/rules.d
  tags: [always]

# authselect owns the PAM stack on RHEL 9 derivatives. A minimal install can
# leave it uninitialised ("No existing configuration detected"), and then no
# feature can be enabled. Several requirements depend on it - 03.01.08
# (faillock) and 03.05.07 (pwquality, pwhistory) - so it is established once
# here rather than repeatedly inside those families.
- name: Check whether the authselect configuration is present and intact
  # `authselect check` fails both when no profile is selected and when the
  # generated PAM files have been edited by hand. Either way the fix is the
  # same: reassert the profile so authselect owns the stack again.
  ansible.builtin.command:
    cmd: authselect check
  register: nist_authselect_check
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [always]

- name: Reassert the authselect profile so it owns the PAM stack
  ansible.builtin.command:
    cmd: authselect select sssd --force
  when: nist_authselect_check.rc != 0
  changed_when: true
  tags: [always]

