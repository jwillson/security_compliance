---
# 03.10 PHYSICAL PROTECTION
#
# Only the boot path is host-enforceable (03.10.07). Everything else in this
# family is a facility control.

- name: "03.10.07 | Warn if no GRUB superuser password was supplied"
  ansible.builtin.debug:
    msg: >-
      No GRUB superuser password: NIST_GRUB_PASSWORD is not set and
      .secrets/admin_password does not exist. The boot path is left as it
      is, and the assessor will report pe-07-grub-password as a deviation.
  when: nist_set_grub_password and nist_grub_password | length == 0
  tags: ["03.10.07"]

- name: "03.10.07 | Remove any cleartext GRUB password an earlier run staged"
  # The role used to stage the password in /root/.grub-pw and leave it there
  # (DEFECTS 6b.2). It is now passed on stdin and never written in clear.
  ansible.builtin.file:
    path: /root/.grub-pw
    state: absent
  tags: ["03.10.07"]

- name: "03.10.07 | Set the GRUB superuser password"
  # 03.10.07a  Console presence alone must not grant control of the system.
  # Written as grub2-setpassword writes it: GRUB2_PASSWORD=<PBKDF2 hash> in
  # /boot/grub2/user.cfg. Nothing else is needed on RHEL 9, and nothing else is
  # touched: the EFI stub hands off to /boot/grub2/grub.cfg, whose stock
  # 01_users block sources ${prefix}/user.cfg and makes "root" the superuser
  # when GRUB2_PASSWORD is set; the BLS boot entries carry
  # `grub_arg --unrestricted`, so the host still boots unattended while
  # editing an entry or reaching the GRUB shell asks for root and this
  # password. (The role used to test the stock 01_users for the string
  # "password_pbkdf2", which its template always contains, so it never set
  # a password at all - DEFECTS 6b.2.)
  # Idempotent without re-salting: an existing hash is kept only if it
  # verifies against the supplied password (PBKDF2 from its own algorithm,
  # iteration count and salt), so a changed NIST_GRUB_PASSWORD takes effect.
  # The password arrives on stdin: never in argv, the environment or a file.
  ansible.builtin.shell:
    executable: /usr/bin/python3
    cmd: |
      import hashlib, hmac, os, subprocess, sys
      path = "/boot/grub2/user.cfg"
      pw = sys.stdin.read().rstrip("\n")
      def verifies(h):
          try:
              _, _, alg, it, salt, want = h.split(".")
              got = hashlib.pbkdf2_hmac(alg, pw.encode(), bytes.fromhex(salt),
                                        int(it), len(want) // 2)
              return hmac.compare_digest(got.hex(), want.lower())
          except (ValueError, TypeError):
              return False
      current = ""
      if os.path.exists(path):
          for line in open(path):
              if line.startswith("GRUB2_PASSWORD="):
                  current = line.split("=", 1)[1].strip()
      if current and verifies(current):
          print("unchanged")
          sys.exit(0)
      out = subprocess.run(["grub2-mkpasswd-pbkdf2"], input=f"{pw}\n{pw}\n",
                           capture_output=True, text=True, check=True).stdout
      new = next(w for w in out.split() if w.startswith("grub.pbkdf2."))
      os.umask(0o077)
      with open(path + ".new", "w") as fh:
          fh.write(f"GRUB2_PASSWORD={new}\n")
      os.replace(path + ".new", path)
      print("changed")
    stdin: "{{ nist_grub_password | trim }}"
  no_log: true
  when: nist_set_grub_password and nist_grub_password | length > 0
  register: nist_grub_pw
  changed_when: nist_grub_pw.stdout == "changed"
  tags: ["03.10.07"]

- name: "03.10.07 | Protect the GRUB configuration files"
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - /boot/grub2/grub.cfg
    - /boot/grub2/user.cfg
  failed_when: false
  tags: ["03.10.07"]

- name: "03.10.07 | Require authentication for single-user and emergency mode"
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: '^\s*ExecStart='
    line: "ExecStart=-/usr/lib/systemd/systemd-sulogin-shell {{ 'rescue' if 'rescue' in item else 'emergency' }}"
    create: false
  loop:
    - /usr/lib/systemd/system/rescue.service
    - /usr/lib/systemd/system/emergency.service
  failed_when: false
  tags: ["03.10.07"]
