---
# 03.03 AUDIT AND ACCOUNTABILITY

# ===========================================================================
# 03.03.01 Event Logging
# ===========================================================================
- name: "03.03.01 | Install the audit subsystem"
  ansible.builtin.dnf:
    name:
      - audit
      - audit-libs
      - rsyslog
    state: present
  register: nist_audit_pkgs
  tags: ["03.03.01"]

- name: "03.03.01 | Remove the stock placeholder rule file"
  # augenrules concatenates /etc/audit/rules.d/* in sorted order, and the
  # package's own `audit.rules` sorts AFTER our 99- file. Its `-f 1` therefore
  # overrides the failure mode we set, and its presence makes the effective
  # policy depend on filename collation. Our file is the authoritative one.
  ansible.builtin.file:
    path: /etc/audit/rules.d/audit.rules
    state: absent
  notify: regenerate audit rules
  tags: ["03.03.01", "03.03.04"]

- name: "03.03.01 | Check whether the boot arguments already enable auditing"
  ansible.builtin.command:
    cmd: grubby --info=ALL
  register: nist_grubby_info
  changed_when: false
  check_mode: false
  tags: ["03.03.01"]

- name: "03.03.01 | Capture audit events from the start of boot"
  # grubby always exits 0, so the current arguments are inspected first.
  ansible.builtin.command:
    cmd: >-
      grubby --update-kernel=ALL
      --args="audit=1 audit_backlog_limit=8192"
  when: >-
    'audit=1' not in nist_grubby_info.stdout or
    'audit_backlog_limit=8192' not in nist_grubby_info.stdout
  changed_when: true
  tags: ["03.03.01"]

# ===========================================================================
# 03.03.02 Audit Record Content / 03.03.03 Generation / 03.03.04 Failures
# ===========================================================================
# The configuration is written before the service is started. auditd refuses to
# start on an unrecognised key, so starting first would fail against whatever
# configuration happened to be on disk from a previous run.
- name: "03.03.02 | Configure auditd record content, retention, and failure response"
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: /etc/audit/auditd.conf
    owner: root
    group: root
    mode: "0640"
  register: nist_auditd_conf
  tags: ["03.03.01", "03.03.02", "03.03.03", "03.03.04", "03.14.08"]

- name: "03.03.01 | Clear any failed auditd state before starting"
  # systemd refuses further start attempts after repeated rapid failures
  # ("Start request repeated too quickly"), which would mask a now-valid config.
  ansible.builtin.command:
    cmd: systemctl reset-failed auditd.service
  changed_when: false
  failed_when: false
  tags: ["03.03.01"]

- name: "03.03.01 | Restart auditd if its configuration changed"
  # auditd sets RefuseManualStop, so systemctl cannot restart it; its own
  # service wrapper is the supported path.
  ansible.builtin.command:
    cmd: /usr/sbin/service auditd restart
  when: nist_auditd_conf is changed
  changed_when: true
  failed_when: false
  tags: ["03.03.01"]

- name: "03.03.01 | Enable auditd and rsyslog"
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - auditd
    - rsyslog
  # Check mode installs nothing, so on a host without the package there is
  # no unit to evaluate. Skipped only then; see the note in main.yml.
  when: not (ansible_check_mode and (nist_audit_pkgs | default({})) is changed)
  tags: ["03.03.01"]

# The rule set itself is deployed by ac.yml (tagged 03.01.07 and 03.03.01) so
# it is written once and loaded atomically.

- name: "03.03.03 | Leave audit log rotation to auditd alone"
  # auditd rotates at max_log_file and, with keep_logs, never deletes; the
  # daily audit review prunes rotated files older than audit_retention_days
  # (see audit-review.sh.j2). A logrotate stanza on the same file fought
  # auditd for the rotation and delivered retention as a file count rather
  # than a period - the ODP review (E2) removed it.
  ansible.builtin.file:
    path: /etc/logrotate.d/nist-audit
    state: absent
  tags: ["03.03.03", "03.14.08"]

# ===========================================================================
# 03.03.05 Audit Record Review, Analysis, and Reporting
# ===========================================================================
- name: "03.03.05 | Install the scheduled audit review report"
  ansible.builtin.template:
    src: audit-review.sh.j2
    dest: "{{ nist_bin_dir }}/nist-audit-review"
    owner: root
    group: root
    mode: "0750"
  tags: ["03.03.05"]

- name: "03.03.05 | Schedule the audit review at the ODP frequency"
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: nist-audit-review.service
      content: |
        [Unit]
        Description=NIST 800-171r3 03.03.05 audit record review
        Documentation=file://{{ nist_conf_dir }}/overlay-rocky9.yml

        [Service]
        Type=oneshot
        ExecStart={{ nist_bin_dir }}/nist-audit-review
    - name: nist-audit-review.timer
      content: |
        [Unit]
        Description=NIST 800-171r3 03.03.05 audit review schedule

        [Timer]
        OnCalendar={{ odp.audit_review_schedule }}
        Persistent=true

        [Install]
        WantedBy=timers.target
  register: nist_audit_review_units
  notify: reload systemd
  tags: ["03.03.05"]

- name: "03.03.05 | Enable the audit review timer"
  ansible.builtin.systemd:
    name: nist-audit-review.timer
    enabled: true
    state: started
    daemon_reload: true
  # Check mode writes nothing, so on a host that lacks the unit there is
  # nothing to enable. Skipped only then; see the note in main.yml.
  when: not (ansible_check_mode and (nist_audit_review_units | default({})) is changed)
  tags: ["03.03.05", "03.12.03"]

# Forwarding runs over TLS with mutual x509 authentication (03.13.08) unless
# nist_log_tls is false. The certificates are read from the control
# workstation (nist_pki_dir) and installed on the host; if they are missing,
# nothing is forwarded and the status file says so, so the assessor reports a
# host that should forward and does not - it never falls back to plaintext.
- name: "03.03.05 | Determine how records will be forwarded"
  ansible.builtin.set_fact:
    nist_fwd_host: "{{ nist_log_collector.split(':')[0] }}"
    nist_fwd_port: "{{ nist_log_collector.split(':')[1] if ':' in nist_log_collector else (6514 if nist_log_tls else 514) }}"
    nist_fwd_ca:   "{{ lookup('file', nist_pki_dir + '/ca.crt', errors='ignore') or '' }}"
    nist_fwd_cert: "{{ lookup('file', nist_pki_dir + '/' + inventory_hostname + '.crt', errors='ignore') or '' }}"
    nist_fwd_key:  "{{ lookup('file', nist_pki_dir + '/' + inventory_hostname + '.key', errors='ignore') or '' }}"
  no_log: true
  when: nist_log_collector | length > 0
  tags: ["03.03.05", "03.13.08"]

- name: "03.03.05 | Note whether TLS forwarding can be configured"
  ansible.builtin.set_fact:
    nist_fwd_tls_ready: >-
      {{ nist_log_tls and nist_fwd_ca | length > 0
         and nist_fwd_cert | length > 0 and nist_fwd_key | length > 0 }}
  when: nist_log_collector | length > 0
  tags: ["03.03.05", "03.13.08"]

- name: "03.03.05 | Warn that records are not forwarded for lack of certificates"
  ansible.builtin.debug:
    msg: >-
      nist_log_tls is true but {{ nist_pki_dir }} does not hold ca.crt,
      {{ inventory_hostname }}.crt and {{ inventory_hostname }}.key, so records
      are NOT forwarded to {{ nist_fwd_host }}. Supply them (make pki for the
      lab, your PKI otherwise) and re-apply. The assessor reports this.
  when: nist_log_collector | length > 0 and nist_log_tls and not nist_fwd_tls_ready
  tags: ["03.03.05", "03.13.08"]

- name: "03.03.05 | Install the rsyslog TLS driver"
  ansible.builtin.dnf:
    name: rsyslog-openssl
    state: present
  when: nist_log_collector | length > 0 and nist_fwd_tls_ready | default(false)
  tags: ["03.03.05", "03.13.08"]

- name: "03.03.05 | Ensure the rsyslog certificate directory exists"
  ansible.builtin.file:
    path: /etc/pki/rsyslog
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: nist_log_collector | length > 0 and nist_fwd_tls_ready | default(false)
  tags: ["03.03.05", "03.13.08"]

- name: "03.03.05 | Install the forwarding certificates"
  ansible.builtin.copy:
    content: "{{ item.content }}\n"
    dest: "/etc/pki/rsyslog/{{ item.name }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { name: ca.crt,   content: "{{ nist_fwd_ca | default('') }}",   mode: "0644" }
    - { name: host.crt, content: "{{ nist_fwd_cert | default('') }}", mode: "0644" }
    - { name: host.key, content: "{{ nist_fwd_key | default('') }}",  mode: "0600" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: nist_log_collector | length > 0 and nist_fwd_tls_ready | default(false)
  notify: restart rsyslog
  tags: ["03.03.05", "03.13.08"]

# 03.03.05c  The audit trail itself must reach the collector, not only what
# syslog sees (DEFECTS 6b.6). auditd's syslog plugin hands each record to the
# journal; the two rate limits on that path are lifted so a burst of records
# is forwarded rather than silently dropped. The local trail in audit.log is
# complete either way.
- name: "03.03.05 | Install auditd's syslog plugin"
  ansible.builtin.dnf:
    name: audispd-plugins
    state: present
  register: nist_audisp_pkg
  when: nist_log_collector | length > 0 and (nist_fwd_tls_ready or not nist_log_tls)
  tags: ["03.03.05"]

- name: "03.03.05 | Dispatch every audit record to syslog (facility local6)"
  ansible.builtin.lineinfile:
    path: /etc/audit/plugins.d/syslog.conf
    regexp: "^\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
  loop:
    - { key: active, value: "yes" }
    - { key: args,   value: LOG_LOCAL6 }
  loop_control:
    label: "{{ item.key }}"
  # The file comes with the package above; see the check-mode note in main.yml.
  when:
    - nist_log_collector | length > 0 and (nist_fwd_tls_ready or not nist_log_tls)
    - not (ansible_check_mode and (nist_audisp_pkg | default({})) is changed)
  notify: restart auditd
  tags: ["03.03.05"]

- name: "03.03.05 | Stop the audit plugin where nothing is forwarded"
  ansible.builtin.lineinfile:
    path: /etc/audit/plugins.d/syslog.conf
    regexp: '^\s*active\s*='
    line: "active = no"
  when: not (nist_log_collector | length > 0 and (nist_fwd_tls_ready or not nist_log_tls))
  failed_when: false
  notify: restart auditd
  tags: ["03.03.05"]

- name: "03.03.05 | Create auditd's systemd drop-in directory"
  ansible.builtin.file:
    path: /etc/systemd/system/auditd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: nist_log_collector | length > 0 and (nist_fwd_tls_ready or not nist_log_tls)
  tags: ["03.03.05"]

- name: "03.03.05 | Exempt auditd's messages from journald rate limiting"
  # Per unit, so the rest of the system keeps journald's default limit. The
  # plugin runs as auditd's child, inside auditd.service.
  ansible.builtin.copy:
    dest: /etc/systemd/system/auditd.service.d/10-nist-log-ratelimit.conf
    content: |
      # 03.03.05c  Every audit record forwarded, none dropped by rate limiting.
      [Service]
      LogRateLimitIntervalSec=0
    owner: root
    group: root
    mode: "0644"
  when: nist_log_collector | length > 0 and (nist_fwd_tls_ready or not nist_log_tls)
  notify: [reload systemd, restart auditd]
  tags: ["03.03.05"]

- name: "03.03.05 | Exempt the journal input from rsyslog rate limiting"
  # imjournal drops messages past 20000 per 10 minutes by default - which a
  # burst of audit records reaches. Set inside the module(load="imjournal")
  # statement, the only place rsyslog accepts it.
  ansible.builtin.lineinfile:
    path: /etc/rsyslog.conf
    regexp: '^\s*Ratelimit\.Interval='
    insertafter: '^module\(load="imjournal"'
    line: '       Ratelimit.Interval="0" # 03.03.05c: forward every audit record'
  when: nist_log_collector | length > 0 and (nist_fwd_tls_ready or not nist_log_tls)
  notify: restart rsyslog
  tags: ["03.03.05"]

- name: "03.03.05 | Forward audit records to the correlation collector"
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/90-nist-forward.conf
    content: |
      # 03.03.05c  Correlate audit records across repositories.
      # Records are queued on disk so a collector outage does not lose them.
      {% if nist_fwd_tls_ready %}
      # 03.13.08  In transit under TLS with mutual x509 authentication: the
      # collector must present a certificate for "{{ nist_log_collector_name }}"
      # issued by the CA, and it verifies this host's certificate the same way.
      global(DefaultNetstreamDriver="ossl"
             DefaultNetstreamDriverCAFile="/etc/pki/rsyslog/ca.crt"
             DefaultNetstreamDriverCertFile="/etc/pki/rsyslog/host.crt"
             DefaultNetstreamDriverKeyFile="/etc/pki/rsyslog/host.key")
      {% endif %}

      # One forwarding action, one disk queue, reached two ways below.
      ruleset(name="nist_forward") {
      {% if nist_fwd_tls_ready %}
          action(type="omfwd" target="{{ nist_fwd_host }}" port="{{ nist_fwd_port }}" protocol="tcp"
                 StreamDriver="ossl" StreamDriverMode="1"
                 StreamDriverAuthMode="x509/name"
                 StreamDriverPermittedPeers="{{ nist_log_collector_name }}"
                 queue.type="LinkedList" queue.filename="nistfwd"
                 queue.saveOnShutdown="on" action.resumeRetryCount="-1")
      {% else %}
          # Plaintext: nist_log_tls is false. Acceptable only on an isolated
          # network; the assessor reports it under 03.13.08.
          action(type="omfwd" target="{{ nist_fwd_host }}" port="{{ nist_fwd_port }}" protocol="tcp"
                 queue.type="LinkedList" queue.filename="nistfwd"
                 queue.saveOnShutdown="on" action.resumeRetryCount="-1")
      {% endif %}
      }

      # 1. The audit trail. auditd writes /var/log/audit/audit.log and none of
      # it reaches syslog on its own, so forwarding syslog alone sent no audit
      # record at all (DEFECTS 6b.6). auditd's syslog plugin (audisp-syslog,
      # activated by the tasks above) dispatches every record through the
      # journal; each is forwarded once and stopped here, so it is not written
      # into /var/log/messages a second time. The records carry the identifier
      # "audispd" on facility local6 - the plugin's own status messages say
      # "audisp-syslog", which is why matching that name let every record
      # through to the local files. The collector files them as
      # <host>/audispd.log. (rsyslog cannot read audit.log directly: SELinux
      # denies syslogd_t on auditd_log_t, silently - and allowing it would
      # widen the logger's access to the trail.)
      if ($programname == "audispd" and $syslogfacility-text == "local6") then {
          call nist_forward
          stop
      }

      # 2. Everything else the local syslog sees.
      call nist_forward
    owner: root
    group: root
    mode: "0600"
  when: nist_log_collector | length > 0 and (nist_fwd_tls_ready or not nist_log_tls)
  notify: restart rsyslog
  tags: ["03.03.05", "03.13.08"]

- name: "03.03.05 | Remove a forwarding rule that can no longer be honoured"
  # A collector is named but TLS is required and the certificates are absent:
  # a stale rule from an earlier run must not keep sending in the clear.
  ansible.builtin.file:
    path: /etc/rsyslog.d/90-nist-forward.conf
    state: absent
  when: nist_log_collector | length == 0 or (nist_log_tls and not nist_fwd_tls_ready | default(false))
  notify: restart rsyslog
  tags: ["03.03.05", "03.13.08"]

- name: "03.03.05 | Record the forwarding status"
  # Read by the assessor (au-05-forward-established, sc-08-forward-encrypted)
  # and by the SSP generator.
  ansible.builtin.copy:
    dest: "{{ nist_conf_dir }}/log-forwarding-status"
    content: |
      # 03.03.05c Audit record correlation - forwarding side.
      #   local-only               no collector is configured (single node)
      #   tls-certificate-missing  a collector is configured, TLS is required,
      #                            and this host has no certificate: nothing
      #                            is forwarded. A deviation, not a fallback.
      #   forwarding               records go to the collector below
      {% if nist_log_collector | length == 0 %}
      status=local-only
      {% elif nist_log_tls and not nist_fwd_tls_ready %}
      status=tls-certificate-missing
      collector={{ nist_fwd_host }}
      {% else %}
      status=forwarding
      collector={{ nist_fwd_host }}
      port={{ nist_fwd_port }}
      transport={{ 'tls' if nist_fwd_tls_ready else 'plain' }}
      audit_trail=/var/log/audit/audit.log
      {% endif %}
    owner: root
    group: root
    mode: "0644"
  tags: ["03.03.05", "03.13.08"]

# ===========================================================================
# 03.03.07 Time Stamps
# ===========================================================================
- name: "03.03.07 | Install chrony"
  ansible.builtin.dnf:
    name: chrony
    state: present
  register: nist_chrony_pkg
  tags: ["03.03.07"]

- name: "03.03.07 | Point the clock at authorized time sources"
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart chronyd
  tags: ["03.03.07"]

- name: "03.03.07 | Set the system clock to UTC"
  community.general.timezone:
    name: Etc/UTC
  tags: ["03.03.07"]

- name: "03.03.07 | Enable chronyd"
  ansible.builtin.systemd:
    name: chronyd
    enabled: true
    state: started
  when: not (ansible_check_mode and (nist_chrony_pkg | default({})) is changed)
  tags: ["03.03.07"]

# ===========================================================================
# 03.03.06 Reduction / 03.03.08 Protection of Audit Information
# ===========================================================================
- name: "03.03.08 | Restrict the audit log directory to root"
  ansible.builtin.file:
    path: /var/log/audit
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: ["03.03.08"]

- name: "03.03.08 | Restrict the audit log files to root"
  # Only loosen nothing: auditd sets rotated logs to 0400, which is stricter
  # than our 0600 target. Forcing 0600 unconditionally would relax them, and
  # would report a change on every run as auditd set them back.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      changed=0
      for f in /var/log/audit/audit.log*; do
        [ -f "$f" ] || continue
        mode=$(stat -c %a "$f")
        if [ "$mode" -gt 600 ]; then chmod 0600 "$f"; changed=1; fi
        if [ "$(stat -c %U:%G "$f")" != "root:root" ]; then
          chown root:root "$f"; changed=1
        fi
      done
      echo "changed=$changed"
    executable: /bin/bash
  register: nist_audit_log_perms
  changed_when: "'changed=1' in nist_audit_log_perms.stdout"
  tags: ["03.03.08"]

- name: "03.03.08 | Protect the audit configuration and rule files"
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0640"
  loop:
    - /etc/audit/auditd.conf
    - /etc/audit/audit.rules
  failed_when: false
  tags: ["03.03.08"]

- name: "03.03.08 | Protect the audit tools from modification"
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - /sbin/auditctl
    - /sbin/auditd
    - /sbin/ausearch
    - /sbin/aureport
    - /sbin/autrace
    - /sbin/augenrules
  failed_when: false
  tags: ["03.03.06", "03.03.08"]
