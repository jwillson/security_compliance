---
# 03.08 MEDIA PROTECTION
#
# This file also realises the storage half of 03.13.08 (Transmission and
# Storage Confidentiality) and 03.04.11 (Information Location), because the
# encrypted CUI volume is the single artifact all three depend on.

# ===========================================================================
# 03.08.09 / 03.13.08 Encrypted volumes for CUI and its backups
# ===========================================================================
- name: "03.08.09 | Install the volume encryption tooling"
  ansible.builtin.dnf:
    name:
      - cryptsetup
      - lvm2
      - clevis
      - clevis-luks
      - clevis-dracut
      - clevis-systemd
      - tpm2-tools
    state: present
  failed_when: false
  tags: ["03.08.09", "03.13.08"]

- name: "03.08.09 | Check the volume group for free space"
  ansible.builtin.command:
    cmd: "vgs --noheadings --units g -o vg_free --nosuffix {{ nist_vg_name }}"
  register: nist_vg_free
  changed_when: false
  failed_when: false
  check_mode: false
  # 03.13.10 too: the TPM bind below is selectable by that tag, and its block
  # needs these facts (DEFECTS 6b.8: --tags 03.13.10 failed on an undefined
  # nist_can_encrypt).
  tags: ["03.08.09", "03.13.08", "03.13.10"]

- name: "03.08.09 | Record whether encrypted volumes can be created"
  ansible.builtin.set_fact:
    nist_vg_has_space: >-
      {{ (nist_vg_free.rc | default(1)) == 0 and
         (nist_vg_free.stdout | default('0') | trim | float) >= 3.0 }}
    nist_can_encrypt: >-
      {{ (nist_vg_free.rc | default(1)) == 0 and
         (nist_vg_free.stdout | default('0') | trim | float) >= 3.0 and
         (nist_luks_passphrase | length > 0) }}
  tags: ["03.08.09", "03.13.08", "03.13.10"]

- name: "03.08.09 | Warn if no LUKS passphrase was supplied"
  ansible.builtin.debug:
    msg: >-
      Volume group {{ nist_vg_name }} has room for the CUI and backup volumes,
      but no passphrase was supplied: NIST_LUKS_PASSPHRASE is not set and
      .secrets/luks_passphrase does not exist (make secrets). 03.08.09 and
      03.13.08 are skipped, not silently passed - the assessor will report
      them.
  when: nist_vg_has_space and nist_luks_passphrase | length == 0
  tags: ["03.08.09", "03.13.08"]

- name: "03.08.09 | Warn if there is not enough free space for encrypted volumes"
  ansible.builtin.debug:
    msg: >-
      {% if (nist_vg_free.rc | default(1)) != 0 -%}
      Volume group {{ nist_vg_name }} does not exist on this host (or lvm2 is
      not installed), so there is nowhere to create the CUI and backup
      volumes.
      {%- else -%}
      Volume group {{ nist_vg_name }} has
      {{ nist_vg_free.stdout | default('0') | trim }} GB free, which is not
      enough for the CUI and backup volumes.
      {%- endif %}
      03.13.08 (storage confidentiality) and 03.08.09 (backup encryption)
      cannot be satisfied until space is available. The auditor will report
      both as failing.
  when: not nist_vg_has_space
  tags: ["03.08.09", "03.13.08"]

- name: "03.08.09 | Look for a TPM"
  ansible.builtin.stat:
    path: /dev/tpmrm0
  register: nist_tpm_dev
  tags: ["03.08.09", "03.13.08", "03.13.10"]

- name: "03.08.09 | Warn that without a TPM the LUKS key must stay on disk"
  ansible.builtin.debug:
    msg: >-
      No TPM (/dev/tpmrm0) on this host, so the CUI and backup volumes cannot
      be sealed to the platform: the key file stays in /root/.luks-key, on the
      same disk as the data, so that the host still boots unattended.
      mp-09-luks-tpm-bound and mp-09-luks-no-key-on-disk will report it.
      Give the host a TPM, or unlock at the console instead.
  when: nist_can_encrypt and not nist_tpm_dev.stat.exists
  tags: ["03.08.09", "03.13.08", "03.13.10"]

# The key that opens the CUI volumes must not rest beside them (DEFECTS 6b.5).
# It is staged only while a volume still needs it - to be formatted, opened
# for the first time or bound - then each volume is bound to the TPM (clevis
# tpm2, PCR 7: sealed to the Secure Boot state), crypttab opens them with
# "none" (the boot-time password request is answered by
# clevis-luks-askpass from the TPM), and the staged key is deleted. The
# passphrase keyslot remains for recovery at the console with
# NIST_LUKS_PASSPHRASE. On a later run every volume is already bound and no
# key is staged at all.
- name: "03.08.09 | Create the encrypted volumes"
  when: nist_can_encrypt
  block:
    - name: "03.08.09 | Create the logical volumes"
      community.general.lvol:
        vg: "{{ nist_vg_name }}"
        lv: "{{ item.lv }}"
        size: "{{ item.size }}"
        state: present
      loop:
        - { lv: lv_cui,    size: "{{ nist_cui_lv_size }}" }
        - { lv: lv_backup, size: "{{ nist_backup_lv_size }}" }
      loop_control:
        label: "{{ item.lv }}"
      register: nist_luks_lvs
      tags: ["03.08.09", "03.13.08"]

    - name: "03.08.09 | Read the state of the encrypted volumes"
      ansible.builtin.shell:
        cmd: |
          for lv in lv_cui lv_backup; do
            dev=/dev/{{ nist_vg_name }}/$lv
            if ! cryptsetup isLuks "$dev" 2>/dev/null; then echo "$lv=unformatted"
            elif clevis luks list -d "$dev" 2>/dev/null | grep -q tpm2; then echo "$lv=bound"
            else echo "$lv=unbound"; fi
          done
        executable: /bin/bash
      register: nist_luks_state
      changed_when: false
      check_mode: false
      tags: ["03.08.09", "03.13.08", "03.13.10"]

    - name: "03.08.09 | Note whether every volume is already bound to the TPM"
      ansible.builtin.set_fact:
        nist_luks_all_bound: "{{ nist_luks_state.stdout_lines | select('search', '=bound$') | list | length == 2 }}"
      tags: ["03.08.09", "03.13.08", "03.13.10"]

    - name: "03.08.09 | Stage the LUKS key while a volume still needs it"
      ansible.builtin.copy:
        content: "{{ nist_luks_passphrase }}"
        dest: /root/.luks-key
        owner: root
        group: root
        mode: "0400"
      no_log: true
      when: not nist_luks_all_bound
      tags: ["03.08.09", "03.13.08", "03.13.10"]

    - name: "03.08.09 | Format the volumes as LUKS2 with an approved cipher"
      # aes-xts-plain64 with a 512-bit key and pbkdf2 are FIPS-approved
      # (03.13.11). argon2 is the cryptsetup default but is not approved.
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          dev=/dev/{{ nist_vg_name }}/{{ item }}
          if cryptsetup isLuks "$dev" 2>/dev/null; then
            echo "already-luks"
            exit 0
          fi
          cryptsetup luksFormat \
            --type luks2 \
            --cipher aes-xts-plain64 \
            --key-size 512 \
            --hash sha512 \
            --pbkdf pbkdf2 \
            --pbkdf-force-iterations 100000 \
            --batch-mode \
            "$dev" /root/.luks-key
          echo "formatted"
        executable: /bin/bash
      loop: [lv_cui, lv_backup]
      register: nist_luks_format
      changed_when: "'formatted' in nist_luks_format.stdout"
      tags: ["03.08.09", "03.13.08"]

    - name: "03.08.09 | Open the encrypted volumes"
      # With the staged key while there is one; once the key is gone, from the
      # TPM - at boot systemd-cryptsetup has normally opened them already.
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          dev=/dev/{{ nist_vg_name }}/{{ item.lv }}
          if [ -e /dev/mapper/{{ item.name }} ]; then
            echo "already-open"
          elif [ -f /root/.luks-key ]; then
            cryptsetup luksOpen --key-file /root/.luks-key "$dev" {{ item.name }} && echo "opened"
          else
            clevis luks unlock -d "$dev" -n {{ item.name }} && echo "opened"
          fi
        executable: /bin/bash
      loop:
        - { lv: lv_cui,    name: cui_data }
        - { lv: lv_backup, name: cui_backup }
      loop_control:
        label: "{{ item.name }}"
      register: nist_luks_open
      changed_when: "'already-open' not in nist_luks_open.stdout"
      tags: ["03.08.09", "03.13.08"]

    - name: "03.08.09 | Create filesystems on the encrypted volumes"
      # Check mode on a host whose volumes do not exist yet: the volumes are
      # only "would be created", format and open are shell tasks check mode
      # skips, so /dev/mapper/* is absent and this would fail on a missing
      # device (DEFECTS 6b.7). The main.yml idiom: skip only in check mode,
      # only while the volumes are outstanding.
      community.general.filesystem:
        fstype: xfs
        dev: "/dev/mapper/{{ item }}"
      loop: [cui_data, cui_backup]
      when: not (ansible_check_mode and (nist_luks_lvs | default({})) is changed)
      tags: ["03.08.09", "03.13.08"]

    - name: "03.08.09 | Bind the volumes to the TPM"
      # 03.13.10: the key is sealed to the platform state instead of resting
      # on disk. The options must come before -d DEV PIN CFG: clevis parses
      # them with getopts, which stops at the first positional, and the
      # role's old order (-d DEV tpm2 CFG -k KEY -y) left -k and -y unread, so
      # clevis prompted for the passphrase, failed without a terminal, and
      # failed_when: false hid it on every host (DEFECTS 6b.5). A failed bind
      # now fails the task.
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          dev=/dev/{{ nist_vg_name }}/{{ item }}
          if clevis luks list -d "$dev" 2>/dev/null | grep -q tpm2; then
            echo "already-bound"
            exit 0
          fi
          clevis luks bind -y -k /root/.luks-key \
            -d "$dev" tpm2 '{"pcr_bank":"sha256","pcr_ids":"7"}' < /dev/null
          echo "bound"
        executable: /bin/bash
      loop: [lv_cui, lv_backup]
      register: nist_clevis
      changed_when: "'already-bound' not in nist_clevis.stdout"
      when: nist_tpm_dev.stat.exists
      tags: ["03.08.09", "03.13.10"]

    - name: "03.08.09 | Note whether the TPM now holds the keys"
      # In check mode the bind does not run; a host bound on an earlier run
      # still counts as bound, so --check reports no drift there.
      ansible.builtin.set_fact:
        nist_luks_tpm_ok: >-
          {{ nist_tpm_dev.stat.exists and (nist_luks_all_bound or
             (nist_clevis.results | default([]) | selectattr('stdout', 'defined')
              | map(attribute='stdout') | select('search', 'bound$')
              | list | length == 2)) }}
      tags: ["03.08.09", "03.13.08", "03.13.10"]

    - name: "03.08.09 | Let clevis answer the boot-time unlock from the TPM"
      ansible.builtin.systemd:
        name: clevis-luks-askpass.path
        enabled: true
      when: nist_luks_tpm_ok
      tags: ["03.08.09", "03.13.08", "03.13.10"]

    - name: "03.08.09 | Register the volumes in crypttab"
      # "none" once the TPM holds the keys: no key file is named, and the
      # password request at boot is answered by clevis-luks-askpass.
      ansible.builtin.lineinfile:
        path: /etc/crypttab
        regexp: '^{{ item.name }}\s'
        line: "{{ item.name }} /dev/{{ nist_vg_name }}/{{ item.lv }} {{ 'none' if nist_luks_tpm_ok else '/root/.luks-key' }} luks,discard"
        create: true
        owner: root
        group: root
        mode: "0600"
      loop:
        - { lv: lv_cui,    name: cui_data }
        - { lv: lv_backup, name: cui_backup }
      loop_control:
        label: "{{ item.name }}"
      tags: ["03.08.09", "03.13.08", "03.13.10"]

    - name: "03.08.09 | Remove the staged key once the TPM holds it"
      ansible.builtin.file:
        path: /root/.luks-key
        state: absent
      when: nist_luks_tpm_ok
      tags: ["03.08.09", "03.13.08", "03.13.10"]

    - name: "03.08.09 | Mount the encrypted CUI and backup filesystems"
      # Same guard as the filesystems above: nothing to mount in check mode
      # while the volumes are outstanding.
      when: not (ansible_check_mode and (nist_luks_lvs | default({})) is changed)
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "/dev/mapper/{{ item.name }}"
        fstype: xfs
        opts: "defaults,nodev,nosuid,noexec"
        state: mounted
      loop:
        - { name: cui_data,   path: "{{ nist_cui_path }}" }
        - { name: cui_backup, path: "{{ nist_backup_path }}" }
      loop_control:
        label: "{{ item.path }}"
      tags: ["03.08.09", "03.13.08", "03.04.11"]

# ===========================================================================
# 03.08.02 Media Access
# ===========================================================================
- name: "03.08.02 | Create the CUI access group"
  ansible.builtin.group:
    name: "{{ nist_cui_group }}"
    state: present
  tags: ["03.08.02", "03.04.11"]

- name: "03.08.02 | Restrict the CUI and backup paths to authorized roles"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ nist_cui_group }}"
    mode: "0770"
  loop:
    - "{{ nist_cui_path }}"
    - "{{ nist_backup_path }}"
  tags: ["03.08.02", "03.04.11", "03.08.09"]

- name: "03.08.02 | Restrict home directories to their owner"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      changed=0
      while IFS=: read -r user _ uid _ _ home _; do
        if [ "$uid" -ge 1000 ] && [ "$uid" != 65534 ] && [ -d "$home" ]; then
          if [ "$(stat -c %a "$home")" != "700" ]; then
            chmod 0700 "$home"; changed=1
          fi
        fi
      done < /etc/passwd
      echo "changed=$changed"
    executable: /bin/bash
  register: nist_homeperms
  changed_when: "'changed=1' in nist_homeperms.stdout"
  tags: ["03.08.02"]

# ===========================================================================
# 03.08.03 Media Sanitization
# ===========================================================================
- name: "03.08.03 | Install media sanitization tooling"
  ansible.builtin.dnf:
    name:
      - coreutils      # shred
      - util-linux     # wipefs, blkdiscard
      - nvme-cli       # cryptographic erase on NVMe
      - hdparm         # ATA secure erase
    state: present
  failed_when: false
  tags: ["03.08.03"]

- name: "03.08.03 | Install the sanitization helper"
  ansible.builtin.template:
    src: sanitize-media.sh.j2
    dest: "{{ nist_bin_dir }}/nist-sanitize-media"
    owner: root
    group: root
    mode: "0750"
  tags: ["03.08.03"]

# ===========================================================================
# 03.08.07 Media Use
# ===========================================================================
# usb-storage is blocked in ac.yml with the other device classes (03.01.20d).
- name: "03.08.07 | Disable removable media automounting in udisks"
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/80-nist-no-automount.rules
    content: |
      # 03.08.07  Removable media is not usable without an authorized exception.
      SUBSYSTEM=="block", ENV{ID_BUS}=="usb", ENV{UDISKS_IGNORE}="1"
      SUBSYSTEM=="block", ENV{ID_BUS}=="usb", ENV{UDISKS_AUTO}="0"
    owner: root
    group: root
    mode: "0644"
  tags: ["03.08.07", "03.01.20"]
