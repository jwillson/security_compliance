---
# 03.08 MEDIA PROTECTION
#
# This file also realises the storage half of 03.13.08 (Transmission and
# Storage Confidentiality) and 03.04.11 (Information Location), because the
# encrypted CUI volume is the single artifact all three depend on.

# ===========================================================================
# 03.08.09 / 03.13.08 Encrypted volumes for CUI and its backups
# ===========================================================================
- name: "03.08.09 | Install the volume encryption tooling"
  ansible.builtin.dnf:
    name:
      - cryptsetup
      - lvm2
      - clevis
      - clevis-luks
      - clevis-dracut
      - clevis-systemd
      - tpm2-tools
    state: present
  failed_when: false
  tags: ["03.08.09", "03.13.08"]

- name: "03.08.09 | Check the volume group for free space"
  ansible.builtin.command:
    cmd: "vgs --noheadings --units g -o vg_free --nosuffix {{ nist_vg_name }}"
  register: nist_vg_free
  changed_when: false
  failed_when: false
  check_mode: false
  # 03.13.10 too: the TPM bind below is selectable by that tag, and its block
  # needs these facts (DEFECTS 6b.8: --tags 03.13.10 failed on an undefined
  # nist_can_encrypt).
  tags: ["03.08.09", "03.13.08", "03.13.10"]

- name: "03.08.09 | Record whether encrypted volumes can be created"
  ansible.builtin.set_fact:
    nist_vg_has_space: >-
      {{ (nist_vg_free.rc | default(1)) == 0 and
         (nist_vg_free.stdout | default('0') | trim | float) >= 3.0 }}
    nist_can_encrypt: >-
      {{ (nist_vg_free.rc | default(1)) == 0 and
         (nist_vg_free.stdout | default('0') | trim | float) >= 3.0 and
         (nist_luks_passphrase | length > 0) }}
  tags: ["03.08.09", "03.13.08", "03.13.10"]

- name: "03.08.09 | Warn if no LUKS passphrase was supplied"
  ansible.builtin.debug:
    msg: >-
      Volume group {{ nist_vg_name }} has room for the CUI and backup volumes,
      but no passphrase was supplied: NIST_LUKS_PASSPHRASE is not set and
      .secrets/luks_passphrase does not exist (make secrets). 03.08.09 and
      03.13.08 are skipped, not silently passed - the assessor will report
      them.
  when: nist_vg_has_space and nist_luks_passphrase | length == 0
  tags: ["03.08.09", "03.13.08"]

- name: "03.08.09 | Warn if there is not enough free space for encrypted volumes"
  ansible.builtin.debug:
    msg: >-
      {% if (nist_vg_free.rc | default(1)) != 0 -%}
      Volume group {{ nist_vg_name }} does not exist on this host (or lvm2 is
      not installed), so there is nowhere to create the CUI and backup
      volumes.
      {%- else -%}
      Volume group {{ nist_vg_name }} has
      {{ nist_vg_free.stdout | default('0') | trim }} GB free, which is not
      enough for the CUI and backup volumes.
      {%- endif %}
      03.13.08 (storage confidentiality) and 03.08.09 (backup encryption)
      cannot be satisfied until space is available. The auditor will report
      both as failing.
  when: not nist_vg_has_space
  tags: ["03.08.09", "03.13.08"]

- name: "03.08.09 | Look for a TPM"
  ansible.builtin.stat:
    path: /dev/tpmrm0
  register: nist_tpm_dev
  tags: ["03.08.09", "03.13.08", "03.13.10"]

- name: "03.08.09 | Unlock by passphrase at the console where there is no TPM"
  # Nowhere to seal the key, and a key file beside the data protects
  # nothing: no key rests on disk, and every boot waits for the passphrase,
  # typed at the console - a BMC's, for a remote machine (ODP-REVIEW I5).
  ansible.builtin.set_fact:
    nist_luks_console_unlock: "{{ not nist_tpm_dev.stat.exists }}"
  tags: ["03.08.09", "03.13.08", "03.13.10"]

- name: "03.08.09 | Warn that without a TPM every boot asks for the passphrase"
  ansible.builtin.debug:
    msg: >-
      No TPM (/dev/tpmrm0) on this host, so the CUI and backup volumes cannot
      be sealed to the platform. No key is left on the disk: every boot waits
      at the console for the LUKS passphrase (NIST_LUKS_PASSPHRASE) - over
      the BMC, for a remote machine - before the CUI filesystems mount
      (ODP-REVIEW I5).
  when: nist_can_encrypt and not nist_tpm_dev.stat.exists
  tags: ["03.08.09", "03.13.08", "03.13.10"]

- name: "03.08.09 | Read the Secure Boot state"
  # The volumes are sealed to PCR 7, which measures the Secure Boot policy.
  # With Secure Boot off that measurement is the same for any boot medium,
  # so a seal made then opens for whoever holds the machine (issue #4). The
  # EFI variable's last byte is the state; four bytes of attributes precede it.
  ansible.builtin.shell:
    cmd: |
      f=$(ls /sys/firmware/efi/efivars/SecureBoot-* 2>/dev/null | head -1)
      [ -n "$f" ] || { echo "absent"; exit 0; }
      od -An -t u1 "$f" | awk '{v=$NF} END {print (v == 1) ? "enabled" : "disabled"}'
    executable: /bin/bash
  register: nist_secure_boot_state
  changed_when: false
  check_mode: false
  tags: ["03.08.09", "03.13.08", "03.13.10"]

- name: "03.08.09 | Seal to the TPM only while Secure Boot is enforced"
  # The owner's decision (ODP-REVIEW I1): with Secure Boot off, no binding is
  # made and no stale one resealed, and the host is treated as one without a
  # TPM - the key stays on disk so it boots unattended, the checks report
  # it, and the rest of the role carries on. Turning Secure Boot back on and
  # re-applying binds (or finds the earlier seal valid again) and removes it.
  ansible.builtin.set_fact:
    nist_luks_seal_allowed: >-
      {{ nist_tpm_dev.stat.exists and
         (nist_secure_boot_state.stdout | default('') | trim) == 'enabled' }}
  tags: ["03.08.09", "03.13.08", "03.13.10"]

- name: "03.08.09 | Choose where the LUKS key is staged"
  # In RAM (/run is tmpfs) when the TPM will hold the keys: the key is needed
  # only to format, open and bind, and never reaches a disk. On disk only
  # when crypttab must name it at boot - a TPM with Secure Boot off (I1),
  # which the checks report. Without a TPM the console asks (I5): RAM too. It used to be /root/.luks-key in every case, written
  # by `copy` through the remote user's ~/.ansible/tmp, and only unlinked
  # afterwards (issue #11).
  ansible.builtin.set_fact:
    nist_luks_keyfile: "{{ '/run/nist-luks-key' if (nist_luks_seal_allowed or nist_luks_console_unlock) else '/root/.luks-key' }}"
  tags: ["03.08.09", "03.13.08", "03.13.10"]

- name: "03.08.09 | Warn that the volumes are not sealed while Secure Boot is off"
  ansible.builtin.debug:
    msg: >-
      This host has a TPM but Secure Boot is
      {{ nist_secure_boot_state.stdout | default('unknown') | trim }}. A PCR 7
      seal made now would open for any boot medium, so the CUI and backup
      volumes are not bound or resealed: the key file stays in
      /root/.luks-key so the host still boots unattended, and
      mp-09-secure-boot, mp-09-luks-tpm-bound and mp-09-luks-no-key-on-disk
      report it. Enforce Secure Boot in the firmware, boot, and re-apply.
  when: nist_can_encrypt and nist_tpm_dev.stat.exists and not nist_luks_seal_allowed
  tags: ["03.08.09", "03.13.08", "03.13.10"]

# The key that opens the CUI volumes must not rest beside them (DEFECTS 6b.5).
# It is staged only while a volume still needs it - to be formatted, opened
# for the first time or bound - or while the TPM is not to be relied on (no
# TPM, or Secure Boot off). Then each volume is bound to the TPM (clevis
# tpm2, PCR 7: sealed to the Secure Boot state), crypttab opens them with
# "none" (the boot-time password request is answered by
# clevis-luks-askpass from the TPM), and the staged key is deleted. The
# passphrase keyslot remains for recovery at the console with
# NIST_LUKS_PASSPHRASE. On a later run every volume is already bound and no
# key is staged at all.
- name: "03.08.09 | Create the encrypted volumes"
  when: nist_can_encrypt
  block:
    - name: "03.08.09 | Create the logical volumes"
      community.general.lvol:
        vg: "{{ nist_vg_name }}"
        lv: "{{ item.lv }}"
        size: "{{ item.size }}"
        state: present
      loop:
        - { lv: lv_cui,    size: "{{ nist_cui_lv_size }}" }
        - { lv: lv_backup, size: "{{ nist_backup_lv_size }}" }
      loop_control:
        label: "{{ item.lv }}"
      register: nist_luks_lvs
      tags: ["03.08.09", "03.13.08"]

    - name: "03.08.09 | Read the state of the encrypted volumes"
      ansible.builtin.shell:
        cmd: |
          # "bound" only if the TPM releases the key now: a binding made
          # before a firmware or Secure Boot update changed PCR 7 is still
          # listed, but the TPM refuses it - "stale", and repaired below.
          for lv in lv_cui lv_backup; do
            dev=/dev/{{ nist_vg_name }}/$lv
            slot=$(clevis luks list -d "$dev" 2>/dev/null | awk -F: '/tpm2/ {print $1; exit}')
            if ! cryptsetup isLuks "$dev" 2>/dev/null; then echo "$lv=unformatted"
            elif [ -z "$slot" ]; then echo "$lv=unbound"
            elif clevis luks pass -d "$dev" -s "$slot" >/dev/null 2>&1; then echo "$lv=bound"
            else echo "$lv=stale"; fi
          done
        executable: /bin/bash
      register: nist_luks_state
      changed_when: false
      check_mode: false
      tags: ["03.08.09", "03.13.08", "03.13.10"]

    - name: "03.08.09 | Note whether every volume is already bound to the TPM"
      ansible.builtin.set_fact:
        nist_luks_all_bound: "{{ nist_luks_state.stdout_lines | select('search', '=bound$') | list | length == 2 }}"
      tags: ["03.08.09", "03.13.08", "03.13.10"]

    - name: "03.08.09 | Stage the LUKS key while a volume still needs it"
      # From stdin, which pipelining carries in memory: `copy` wrote the
      # content to a temporary file in the remote user's home first.
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          umask 077
          f={{ nist_luks_keyfile }}
          cat > "$f.new"
          if [ -f "$f" ] && cmp -s "$f.new" "$f"; then
            rm -f "$f.new"; echo unchanged
          else
            mv -f "$f.new" "$f"; echo staged
          fi
        executable: /bin/bash
        stdin: "{{ nist_luks_passphrase }}"
        stdin_add_newline: false
      register: nist_luks_stage
      changed_when: nist_luks_stage.stdout == 'staged'
      no_log: true
      # Also whenever the TPM will not be relied on (Secure Boot off): crypttab
      # then names this file, which must exist for the host to boot.
      when: not nist_luks_all_bound or not nist_luks_seal_allowed
      tags: ["03.08.09", "03.13.08", "03.13.10"]

    - name: "03.08.09 | Format the volumes as LUKS2 with an approved cipher"
      # aes-xts-plain64 with a 512-bit key and pbkdf2 are FIPS-approved
      # (03.13.11). argon2 is the cryptsetup default but is not approved.
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          dev=/dev/{{ nist_vg_name }}/{{ item }}
          if cryptsetup isLuks "$dev" 2>/dev/null; then
            echo "already-luks"
            exit 0
          fi
          cryptsetup luksFormat \
            --type luks2 \
            --cipher aes-xts-plain64 \
            --key-size 512 \
            --hash sha512 \
            --pbkdf pbkdf2 \
            --pbkdf-force-iterations 100000 \
            --batch-mode \
            "$dev" {{ nist_luks_keyfile }}
          echo "formatted"
        executable: /bin/bash
      loop: [lv_cui, lv_backup]
      register: nist_luks_format
      changed_when: "'formatted' in nist_luks_format.stdout"
      tags: ["03.08.09", "03.13.08"]

    - name: "03.08.09 | Open the encrypted volumes"
      # With the staged key while there is one; once the key is gone, from the
      # TPM - at boot systemd-cryptsetup has normally opened them already.
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          dev=/dev/{{ nist_vg_name }}/{{ item.lv }}
          if [ -e /dev/mapper/{{ item.name }} ]; then
            echo "already-open"
          elif [ -f {{ nist_luks_keyfile }} ]; then
            cryptsetup luksOpen --key-file {{ nist_luks_keyfile }} "$dev" {{ item.name }} && echo "opened"
          else
            clevis luks unlock -d "$dev" -n {{ item.name }} && echo "opened"
          fi
        executable: /bin/bash
      loop:
        - { lv: lv_cui,    name: cui_data }
        - { lv: lv_backup, name: cui_backup }
      loop_control:
        label: "{{ item.name }}"
      register: nist_luks_open
      changed_when: "'already-open' not in nist_luks_open.stdout"
      tags: ["03.08.09", "03.13.08"]

    - name: "03.08.09 | Create filesystems on the encrypted volumes"
      # Check mode on a host whose volumes do not exist yet: the volumes are
      # only "would be created", format and open are shell tasks check mode
      # skips, so /dev/mapper/* is absent and this would fail on a missing
      # device (DEFECTS 6b.7). The main.yml idiom: skip only in check mode,
      # only while the volumes are outstanding.
      community.general.filesystem:
        fstype: xfs
        dev: "/dev/mapper/{{ item }}"
      loop: [cui_data, cui_backup]
      when: not (ansible_check_mode and (nist_luks_lvs | default({})) is changed)
      tags: ["03.08.09", "03.13.08"]

    - name: "03.08.09 | Bind the volumes to the TPM"
      # 03.13.10: the key is sealed to the platform state instead of resting
      # on disk. The options must come before -d DEV PIN CFG: clevis parses
      # them with getopts, which stops at the first positional, and the
      # role's old order (-d DEV tpm2 CFG -k KEY -y) left -k and -y unread, so
      # clevis prompted for the passphrase, failed without a terminal, and
      # failed_when: false hid it on every host (DEFECTS 6b.5). A failed bind
      # fails the task: `set -e` ends the script at the failing command, so
      # its last line - the word the tasks below read - is never printed.
      # Without it a failed bind still printed "bound", crypttab was set to
      # none and the key deleted, and the next boot stopped at the console
      # (issue #3; tools/probes/bind-script-experiment.sh shows both). The
      # TPM is then asked for the key, so a seal it will not release fails
      # too, before anything relies on it.
      # A stale binding (the TPM refuses it since PCR 7 changed) is resealed
      # to the current state with `clevis luks regen`, the passphrase on
      # stdin - so after a firmware update, recovery is the passphrase at the
      # console once, then this task (RUNBOOK, "When you are locked out").
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          dev=/dev/{{ nist_vg_name }}/{{ item }}
          slot=$(clevis luks list -d "$dev" 2>/dev/null | awk -F: '/tpm2/ {print $1; exit}')
          if [ -n "$slot" ] && clevis luks pass -d "$dev" -s "$slot" >/dev/null 2>&1; then
            echo "already-bound"
            exit 0
          elif [ -n "$slot" ]; then
            clevis luks regen -q -d "$dev" -s "$slot" < {{ nist_luks_keyfile }} > /dev/null
            result=resealed
          else
            clevis luks bind -y -k {{ nist_luks_keyfile }} \
              -d "$dev" tpm2 '{"pcr_bank":"sha256","pcr_ids":"7"}' < /dev/null
            result=bound
          fi
          slot=$(clevis luks list -d "$dev" | awk -F: '/tpm2/ {print $1; exit}')
          [ -n "$slot" ] || { echo "no tpm2 binding on $dev after $result" >&2; exit 1; }
          clevis luks pass -d "$dev" -s "$slot" > /dev/null \
            || { echo "the TPM does not release the key for $dev (slot $slot) after $result" >&2; exit 1; }
          echo "$result"
        executable: /bin/bash
      loop: [lv_cui, lv_backup]
      register: nist_clevis
      changed_when: "'already-bound' not in nist_clevis.stdout"
      when: nist_luks_seal_allowed
      tags: ["03.08.09", "03.13.08", "03.13.10"]

    - name: "03.08.09 | Note whether the TPM now holds the keys"
      # In check mode the bind does not run; a host bound on an earlier run
      # still counts as bound, so --check reports no drift there.
      ansible.builtin.set_fact:
        nist_luks_tpm_ok: >-
          {{ nist_luks_seal_allowed and (nist_luks_all_bound or
             (nist_clevis.results | default([]) | selectattr('stdout', 'defined')
              | map(attribute='stdout') | select('search', '(bound|resealed)$')
              | list | length == 2)) }}
      tags: ["03.08.09", "03.13.08", "03.13.10"]

    - name: "03.08.09 | Let clevis answer the boot-time unlock from the TPM"
      ansible.builtin.systemd:
        name: clevis-luks-askpass.path
        enabled: true
      when: nist_luks_tpm_ok
      tags: ["03.08.09", "03.13.08", "03.13.10"]

    - name: "03.08.09 | Register the volumes in crypttab"
      # "none" once the TPM holds the keys: no key file is named, and the
      # password request at boot is answered by clevis-luks-askpass. "none"
      # too where there is no TPM: the request then waits at the console for
      # the passphrase (ODP-REVIEW I5).
      ansible.builtin.lineinfile:
        path: /etc/crypttab
        regexp: '^{{ item.name }}\s'
        line: "{{ item.name }} /dev/{{ nist_vg_name }}/{{ item.lv }} {{ 'none' if (nist_luks_tpm_ok or nist_luks_console_unlock) else '/root/.luks-key' }} luks,discard"
        create: true
        owner: root
        group: root
        mode: "0600"
      loop:
        - { lv: lv_cui,    name: cui_data }
        - { lv: lv_backup, name: cui_backup }
      loop_control:
        label: "{{ item.name }}"
      tags: ["03.08.09", "03.13.08", "03.13.10"]

    - name: "03.08.09 | Remove the staged key once the TPM holds it, or the console asks for it"
      # The RAM copy is simply removed. A copy on disk - every earlier
      # version staged it there - is overwritten before it is unlinked; on a
      # copy-on-write or SSD-backed store that is best effort, which is why
      # the key no longer goes to disk when the TPM is to hold it (issue #11).
      ansible.builtin.shell:
        cmd: |
          gone=0
          if [ -e /run/nist-luks-key ]; then rm -f /run/nist-luks-key; gone=1; fi
          if [ -e /root/.luks-key ]; then shred -u -z /root/.luks-key; gone=1; fi
          echo "removed=$gone"
        executable: /bin/bash
      register: nist_luks_unstage
      changed_when: "'removed=1' in nist_luks_unstage.stdout"
      when: nist_luks_tpm_ok or nist_luks_console_unlock
      tags: ["03.08.09", "03.13.08", "03.13.10"]

    - name: "03.08.09 | Mount the encrypted CUI and backup filesystems"
      # Same guard as the filesystems above: nothing to mount in check mode
      # while the volumes are outstanding.
      when: not (ansible_check_mode and (nist_luks_lvs | default({})) is changed)
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "/dev/mapper/{{ item.name }}"
        fstype: xfs
        opts: "defaults,nodev,nosuid,noexec"
        state: mounted
      loop:
        - { name: cui_data,   path: "{{ nist_cui_path }}" }
        - { name: cui_backup, path: "{{ nist_backup_path }}" }
      loop_control:
        label: "{{ item.path }}"
      tags: ["03.08.09", "03.13.08", "03.04.11"]

# ===========================================================================
# 03.08.02 Media Access
# ===========================================================================
- name: "03.08.02 | Create the CUI access group"
  ansible.builtin.group:
    name: "{{ nist_cui_group }}"
    state: present
  # 03.08.09 too: the path task below runs under that tag and needs the
  # group, so `--tags 03.08.09` on a fresh host failed on "failed to look up
  # group" (the 1b.7 failure, found by tools/rehearse-luks-staging.sh).
  tags: ["03.08.02", "03.04.11", "03.08.09"]

- name: "03.08.02 | Restrict the CUI and backup paths to authorized roles"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ nist_cui_group }}"
    mode: "0770"
  loop:
    - "{{ nist_cui_path }}"
    - "{{ nist_backup_path }}"
  tags: ["03.08.02", "03.04.11", "03.08.09"]

- name: "03.08.02 | Restrict home directories to their owner"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      changed=0
      while IFS=: read -r user _ uid _ _ home _; do
        if [ "$uid" -ge 1000 ] && [ "$uid" != 65534 ] && [ -d "$home" ]; then
          if [ "$(stat -c %a "$home")" != "700" ]; then
            chmod 0700 "$home"; changed=1
          fi
        fi
      done < /etc/passwd
      echo "changed=$changed"
    executable: /bin/bash
  register: nist_homeperms
  changed_when: "'changed=1' in nist_homeperms.stdout"
  tags: ["03.08.02"]

# ===========================================================================
# 03.08.03 Media Sanitization
# ===========================================================================
- name: "03.08.03 | Install media sanitization tooling"
  ansible.builtin.dnf:
    name:
      - coreutils      # shred
      - util-linux     # wipefs, blkdiscard
      - nvme-cli       # cryptographic erase on NVMe
      - hdparm         # ATA secure erase
    state: present
  failed_when: false
  tags: ["03.08.03"]

- name: "03.08.03 | Install the sanitization helper"
  ansible.builtin.template:
    src: sanitize-media.sh.j2
    dest: "{{ nist_bin_dir }}/nist-sanitize-media"
    owner: root
    group: root
    mode: "0750"
  tags: ["03.08.03"]

# ===========================================================================
# 03.08.07 Media Use
# ===========================================================================
# usb-storage is blocked in ac.yml with the other device classes (03.01.20d).
- name: "03.08.07 | Disable removable media automounting in udisks"
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/80-nist-no-automount.rules
    content: |
      # 03.08.07  Removable media is not usable without an authorized exception.
      SUBSYSTEM=="block", ENV{ID_BUS}=="usb", ENV{UDISKS_IGNORE}="1"
      SUBSYSTEM=="block", ENV{ID_BUS}=="usb", ENV{UDISKS_AUTO}="0"
    owner: root
    group: root
    mode: "0644"
  tags: ["03.08.07", "03.01.20"]
