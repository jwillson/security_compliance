---
# Apply the NIST SP 800-171r3 overlay to Rocky Linux 9 hosts.
#
#   ansible-playbook site.yml                     apply everything
#   ansible-playbook site.yml --tags 03.03        one family
#   ansible-playbook site.yml --tags 03.05.07     one requirement
#   ansible-playbook site.yml --check --diff      report drift, change nothing
#
# The ODP values and the requirement mapping both come from
# catalog/overlay-rocky9.yml, so the role and the auditor can never disagree
# about what the baseline says.

- name: NIST SP 800-171r3 overlay for Rocky Linux 9
  hosts: cui_hosts
  become: true
  gather_facts: true

  vars_files:
    - catalog/overlay-rocky9.yml

  pre_tasks:
    - name: Confirm the target is Rocky Linux 9
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Rocky'
          - ansible_facts['distribution_major_version'] == '9'
        fail_msg: >-
          This overlay targets Rocky Linux 9. Found
          {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}.
      tags: [always]

    # The kickstart creates this directory in %post, so a host built by this
    # toolkit already has it and the task below used to succeed by accident.
    # On any other Rocky 9 host it does not exist yet — the role task that
    # creates it runs in `roles:`, which is after `pre_tasks:` — so the play
    # failed on its second task with "Destination directory does not exist".
    # That made the portability claim false as shipped. Create it here.
    - name: Ensure the toolkit configuration directory exists
      ansible.builtin.file:
        path: "{{ nist_conf_dir | default('/etc/nist-800-171') }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      tags: [always]

    - name: Record which overlay version is being applied
      ansible.builtin.copy:
        dest: "{{ nist_conf_dir | default('/etc/nist-800-171') }}/overlay-version"
        content: |
          overlay_version={{ meta.version }}
          overlay_name={{ meta.name }}
          baseline={{ meta.baseline }}
          # Deliberately no timestamp: it would make this file change on every
          # run, so `--check` could never distinguish drift from a no-op.
        owner: root
        group: root
        mode: "0644"
      tags: [always, "03.04.02"]

  roles:
    - role: nist_800_171

  post_tasks:
    - name: Look for a reboot the host owes, whatever caused it
      # The handlers flag the reboots the role causes (audit rules, FIPS,
      # kernel arguments). A kernel that dnf-automatic installed (03.14.01) is
      # owed one too - sa-02-kernel-current fails until it happens, and the
      # advisories it fixes stay pending - yet this reported "Reboot required:
      # False" on a host running the old one (DEFECTS 6b.10). The kernel test
      # is sa-02's; needs-restarting covers libraries and services.
      ansible.builtin.shell:
        cmd: |
          running=$(uname -r)
          newest=$(rpm -q --last kernel 2>/dev/null | head -1 | awk '{print $1}' | sed 's/^kernel-//')
          if [ -n "$newest" ] && [ "$running" != "$newest" ]; then
            echo "kernel $newest is installed, $running is running"
          fi
          needs-restarting -r >/dev/null 2>&1
          [ $? -eq 1 ] && echo "core libraries or services were updated since boot"
          true
        executable: /bin/bash
      register: nist_pending_reboot
      changed_when: false
      check_mode: false
      tags: [always]

    - name: Report what was applied
      ansible.builtin.debug:
        msg: >-
          Overlay {{ meta.version }} applied.
          Reboot required: {{ (nist_reboot_required | default(false)) or
                              (nist_pending_reboot.stdout | default('') | length > 0) }}{{
            ' (' ~ (nist_pending_reboot.stdout_lines | join('; ')) ~ ')'
            if nist_pending_reboot.stdout | default('') | length > 0 else '' }}.
          Run ./verify.sh to assess the host against all 97 requirements.
      tags: [always]


# 03.03.05c asks for audit records to be correlated across repositories, which
# needs somewhere to correlate them. The play above configures the forwarding
# side on every CUI host; this configures the receiving side on whichever
# host the inventory puts in log_hosts. With no such host the group is empty
# and the play is skipped - and the assessor then reports the forwarding
# check as MANUAL rather than passing it, because nothing was verified.
#
# A collector is hardened by the play above as well: it holds other systems'
# audit records, so it is a CUI host. This only adds the receiving half.
- name: Log collector for cross-repository correlation (03.03.05c)
  hosts: log_hosts
  become: true
  gather_facts: true

  vars_files:
    - catalog/overlay-rocky9.yml

  roles:
    - role: nist_log_collector

  tags: ["03.03.05", "collector"]
