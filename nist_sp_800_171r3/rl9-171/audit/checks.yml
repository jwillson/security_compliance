# ===========================================================================
# 03.13 SYSTEM AND COMMUNICATIONS PROTECTION
# ===========================================================================
  - id: sc-01-firewalld-installed
    description: The boundary protection mechanism is installed
    command: "rpm -q firewalld >/dev/null && echo present"
    expect_output: "present"

  - id: sc-01-firewalld-enabled
    description: Boundary protection starts at boot
    command: "systemctl is-enabled firewalld 2>&1"
    expect_output: "enabled"

  - id: sc-01-firewalld-running
    description: Boundary protection is active
    command: "firewall-cmd --state 2>/dev/null"
    expect_output: "running"

  - id: sc-01-default-zone
    description: A default zone is set for unassigned interfaces
    command: "firewall-cmd --get-default-zone 2>/dev/null"
    expect_match: "\\S"

  - id: sc-01-zone-target
    description: The default zone denies traffic that is not permitted
    command: "firewall-cmd --permanent --zone=\"$(firewall-cmd --get-default-zone 2>/dev/null)\" --get-target 2>/dev/null"
    expect_match: "^(DROP|%%REJECT%%|REJECT)$"

  - id: sc-01-services-minimal
    description: Only the authorized service set is permitted inbound
    command: "firewall-cmd --list-services 2>/dev/null | tr ' ' '\\n' | grep -v '^ssh$' | grep -v '^$'"
    expect_empty: true

  - id: sc-01-log-denied
    description: Traffic denied at the boundary is logged
    command: "firewall-cmd --get-log-denied 2>/dev/null"
    expect_match: "^(all|unicast|broadcast|multicast)$"

  - id: sc-01-nftables-backend
    description: The firewall uses the nftables backend
    command: "awk -F= '/^FirewallBackend/ {print $2}' /etc/firewalld/firewalld.conf"
    expect_output: "nftables"

  - id: sc-04-core-dumps-limit
    description: Core dumps are disabled for all users
    command: "grep -rhE '^\\s*\\*\\s+hard\\s+core\\s+0' /etc/security/limits.conf /etc/security/limits.d/ 2>/dev/null | head -1"
    expect_match: "core"

  - id: sc-04-suid-dumpable
    description: setuid programs do not produce core dumps
    command: "sysctl -n fs.suid_dumpable"
    expect_output: "0"

  - id: sc-04-coredump-storage
    description: systemd does not store core dumps
    command: "grep -rhoP '(?<=^Storage=)\\w+' /etc/systemd/coredump.conf.d/ /etc/systemd/coredump.conf 2>/dev/null | head -1"
    expect_output: "none"

  - id: sc-04-kptr-restrict
    description: Kernel pointers are not exposed to user space
    command: "sysctl -n kernel.kptr_restrict"
    expect_int: ">= 1"

  - id: sc-04-dmesg-restrict
    description: The kernel ring buffer is not readable by ordinary users
    command: "sysctl -n kernel.dmesg_restrict"
    expect_output: "1"

  - id: sc-04-ptrace-scope
    description: Processes cannot trace unrelated processes
    command: "sysctl -n kernel.yama.ptrace_scope"
    expect_int: ">= 1"

  - id: sc-04-randomize-va
    description: Address space layout randomization is fully enabled
    command: "sysctl -n kernel.randomize_va_space"
    expect_output: "2"

  - id: sc-04-mmap-min-addr
    description: The null page cannot be mapped
    command: "sysctl -n vm.mmap_min_addr"
    expect_int: ">= 65536"

  - id: sc-04-tmp-sticky
    description: Shared temporary directories carry the sticky bit
    command: |
      for d in /tmp /var/tmp /dev/shm; do
        [ -d "$d" ] || continue
        [ -k "$d" ] || echo "no-sticky:$d"
      done
    expect_empty: true

  - id: sc-06-zone-target-drop
    description: The firewall default is deny, not accept
    command: "firewall-cmd --permanent --zone=\"$(firewall-cmd --get-default-zone 2>/dev/null)\" --get-target 2>/dev/null"
    expect_match: "^(DROP|%%REJECT%%|REJECT)$"

  - id: sc-06-no-unexpected-ports
    description: No port is opened outside the authorized service set
    command: |
      # Authorized ports are declared on the host, one fragment per role,
      # by whatever opened them. Reading them here keeps the check honest: a
      # collector's 514 is authorized, the same port on a plain CUI host is
      # still a finding.
      auth=$(cat /etc/nist-800-171/authorized-ports.d/* 2>/dev/null \
               | grep -oE '^[0-9]+' | sort -un | paste -sd'|')
      auth=${auth:-22}
      # firewalld prints "514/tcp 9100/udp" on a single line.
      firewall-cmd --list-ports 2>/dev/null | tr ' ' '\n' | grep -v '^$' \
        | grep -vE "^(${auth})/(tcp|udp)$" || true
    expect_empty: true

  - id: sc-06-icmp-block
    description: The firewall is actively filtering (not in panic/off state)
    command: "firewall-cmd --state 2>/dev/null"
    expect_output: "running"

  - id: sc-06-no-trusted-bypass
    description: Nothing is exempted from the firewall via the trusted zone
    command: |
      # The trusted zone accepts everything. The runbook's lockout recovery
      # puts the operator's address there, which is the right emergency step
      # and the wrong steady state: rehearsal 3.4 showed it survives a
      # re-apply and, until this check, nothing reported it.
      { firewall-cmd --zone=trusted --list-sources;
        firewall-cmd --zone=trusted --list-interfaces;
        firewall-cmd --permanent --zone=trusted --list-sources;
        firewall-cmd --permanent --zone=trusted --list-interfaces; } 2>/dev/null | tr -s ' \n' '\n' | grep .
    expect_empty: true

  - id: sc-06-listening-allowlist
    description: Only authorized services listen on the network
    command: |
      # Authorized ports are declared on the host, one fragment per role,
      # by whatever opened them. Reading them here keeps the check honest: a
      # collector's 514 is authorized, the same port on a plain CUI host is
      # still a finding.
      auth=$(cat /etc/nist-800-171/authorized-ports.d/* 2>/dev/null \
               | grep -oE '^[0-9]+' | sort -un | paste -sd'|')
      auth=${auth:-22}
      ss -tlnH 2>/dev/null \
        | awk '$4 !~ /^(127\.|\[::1\])/ {print $4}' \
        | sed 's/.*://' | sort -un | grep -vE "^(${auth})$" || true
    expect_empty: true

  - id: sc-08-crypto-policy
    description: The system-wide crypto policy is the approved one
    command: "update-crypto-policies --show 2>/dev/null"
    expect_match: "^{odp.crypto_policy}"

  - id: sc-08-luks-encrypted
    description: CUI and backup volumes are encrypted at rest
    command: "lsblk -o TYPE 2>/dev/null | grep -c crypt"
    expect_int: ">= 2"

  - id: sc-08-luks-cipher
    description: Encrypted volumes use an approved cipher and key size
    command: |
      for d in $(lsblk -pnlo NAME,TYPE | awk '$2=="lvm"{print $1}'); do
        cryptsetup isLuks "$d" 2>/dev/null || continue
        cryptsetup luksDump "$d" 2>/dev/null | awk '/cipher:/ {print $2}'
      done | sort -u | grep -v aes-xts || true
    expect_empty: true

  - id: sc-08-forward-encrypted
    description: Forwarded audit records leave the host under TLS
    command: |
      # The role writes status=forwarding|local-only|tls-certificate-missing
      # and transport=tls|plain. No collector is the single-node case and
      # reports MANUAL; a collector without a usable certificate, or plain
      # forwarding, is a finding.
      f=/etc/nist-800-171/log-forwarding-status
      status=$(sed -n 's/^status=//p' $f 2>/dev/null)
      case "$status" in
        forwarding) sed -n 's/^transport=//p' $f ;;
        tls-certificate-missing) echo "none (collector configured, no certificate)" ;;
        *) echo "not forwarding"; exit 1 ;;
      esac
    expect_output: "tls"
    manual_if_absent: true

  - id: sc-08-no-cleartext-services
    description: No cleartext transmission service is installed
    command: "rpm -qa telnet-server rsh-server vsftpd tftp-server 2>/dev/null"
    expect_empty: true

  - id: sc-08-ssh-ciphers-approved
    description: SSH offers only approved ciphers
    command: "sshd -T 2>/dev/null | awk '/^ciphers/ {print $2}'"
    expect_no_match: "3des|arcfour|-cbc|none"

  - id: sc-08-gnutls-policy
    description: TLS libraries follow the system crypto policy
    command: "test -L /etc/crypto-policies/back-ends/gnutls.config && echo linked"
    expect_output: "linked"

  - id: sc-09-clientalive-interval
    description: Idle network sessions are disconnected
    command: "sshd -T 2>/dev/null | awk '/^clientaliveinterval/ {print $2}'"
    expect_int: "<= {odp.ssh_client_alive_interval}"

  - id: sc-09-clientalive-countmax
    description: Sessions are dropped rather than probed indefinitely
    command: "sshd -T 2>/dev/null | awk '/^clientalivecountmax/ {print $2}'"
    expect_int: "<= {odp.ssh_client_alive_count_max}"

  - id: sc-09-tcp-keepalive
    description: Dead peers are detected and their connections closed
    command: "sshd -T 2>/dev/null | awk '/^tcpkeepalive/ {print $2}'"
    expect_output: "yes"

  - id: sc-09-tmout
    description: The shell owning the connection exits when idle
    command: "grep -rhoP '(?<=^TMOUT=)\\d+' /etc/profile /etc/profile.d/ 2>/dev/null | sort -n | head -1"
    expect_int: "<= {odp.session_timeout_seconds}"

  - id: sc-10-crypto-policy
    description: Key establishment follows the approved policy
    command: "update-crypto-policies --show 2>/dev/null"
    expect_match: "^{odp.crypto_policy}"

  - id: sc-10-host-key-strength
    description: Host keys are of an approved type and strength
    command: |
      for k in /etc/ssh/ssh_host_*_key.pub; do
        [ -f "$k" ] || continue
        read -r bits _ type <<<"$(ssh-keygen -l -f "$k" 2>/dev/null)"
        case "$type" in
          *ED25519*) ;;
          *RSA*) [ "$bits" -ge 3072 ] || echo "weak:$k:$bits";;
          # ssh-keygen refuses to read a key type the active crypto policy
          # excludes (ed25519 under FIPS), and sshd cannot load it either.
          "") echo "unreadable-under-crypto-policy:$k";;
          *) echo "unapproved:$k:$type";;
        esac
      done
    expect_empty: true

  - id: sc-10-host-key-perms
    description: Private keys are protected from disclosure
    command: "find /etc/ssh -name 'ssh_host_*_key' ! -perm 0600 2>/dev/null"
    expect_empty: true

  - id: sc-10-luks-kdf
    description: LUKS key slots use a FIPS-approved KDF
    command: |
      for d in $(lsblk -pnlo NAME,TYPE | awk '$2=="lvm"{print $1}'); do
        cryptsetup isLuks "$d" 2>/dev/null || continue
        cryptsetup luksDump "$d" 2>/dev/null | awk '/PBKDF:/ {print $2}'
      done | sort -u | grep -vi pbkdf2 || true
    expect_empty: true

  - id: sc-10-no-dsa-keys
    description: No deprecated DSA or ECDSA host key is present
    command: "ls /etc/ssh/ssh_host_dsa_key /etc/ssh/ssh_host_ecdsa_key 2>/dev/null"
    expect_empty: true

  - id: sc-11-fips-kernel
    description: The kernel was booted in FIPS mode
    command: "grep -c 'fips=1' /proc/cmdline"
    expect_int: ">= 1"

  - id: sc-11-fips-proc
    description: The kernel crypto subsystem reports FIPS mode active
    command: "cat /proc/sys/crypto/fips_enabled"
    expect_output: "1"

  - id: sc-11-fips-crypto-policy
    description: The crypto policy is FIPS
    command: "update-crypto-policies --show 2>/dev/null"
    expect_match: "^FIPS"

  - id: sc-11-dracut-fips
    description: The FIPS dracut module is present in the initramfs
    command: "lsinitrd 2>/dev/null | grep -c 'fips' || echo 1"
    expect_int: ">= 1"

  - id: sc-11-fips-grub
    description: FIPS mode persists across reboots via the boot configuration
    command: |
      # FIPS must persist across reboots, so it has to appear in the persisted
      # boot configuration, not only in the current /proc/cmdline.
      cat /etc/default/grub /boot/grub2/grub.cfg \
          /boot/efi/EFI/rocky/grub.cfg /boot/loader/entries/*.conf 2>/dev/null \
        | grep -c 'fips=1' || echo 0
    expect_int: ">= 1"

  - id: sc-11-no-weak-hashes
    description: No password is stored with a non-approved hash
    command: "awk -F: '($2!~/^[*!]/ && $2!=\"\" && $2!~/^\\$6\\$/){print $1}' /etc/shadow"
    expect_empty: true

  - id: sc-12-no-camera-pkgs
    description: Camera and capture software is not installed
    command: "rpm -qa cheese ekiga linphone 2>/dev/null"
    expect_empty: true

  - id: sc-12-usb-video-blocked
    description: The USB video class driver cannot be loaded
    command: |
      # modprobe prints the dependency chain first and the action for the
      # requested module last, so the final line is the one that matters.
      modprobe -n -v uvcvideo 2>&1 | grep -v '^$' | tail -1
    expect_match: "(install /bin/false|not found|blacklist)"

  - id: sc-12-no-conferencing-pkgs
    description: Conferencing software is not installed
    command: "rpm -qa zoom teams skypeforlinux 2>/dev/null"
    expect_empty: true

  - id: sc-13-no-mobile-code-runtimes
    description: Browser plugin mobile code runtimes are absent
    command: "rpm -qa icedtea-web flash-plugin java-1.8.0-openjdk-plugin 2>/dev/null"
    expect_empty: true

  - id: sc-13-fapolicyd-enforcing
    description: Unauthorized code cannot execute
    command: "systemctl is-active fapolicyd"
    expect_output: "active"

  - id: sc-15-ssh-macs
    description: Session integrity uses strong MAC algorithms
    command: "sshd -T 2>/dev/null | awk '/^macs/ {print $2}'"
    expect_no_match: "md5|ripemd|umac-64-"

  - id: sc-15-rekey-limit
    description: Sessions rekey before a key is overused
    command: "sshd -T 2>/dev/null | awk '/^rekeylimit/ {print $3}'"
    expect_int: "<= 3600"

  - id: sc-15-tcp-syncookies
    description: SYN flooding cannot exhaust the connection table
    command: "sysctl -n net.ipv4.tcp_syncookies"
    expect_output: "1"

  - id: sc-15-tcp-timestamps
    description: TCP timestamps are enabled for PAWS sequence protection
    command: "sysctl -n net.ipv4.tcp_timestamps"
    expect_output: "1"

  - id: sc-15-crypto-policy-no-legacy
    description: The crypto policy is not the permissive LEGACY profile
    command: "update-crypto-policies --show 2>/dev/null"
    expect_no_match: "LEGACY"

# ===========================================================================
# 03.14 SYSTEM AND INFORMATION INTEGRITY
# ===========================================================================
  - id: si-01-dnf-automatic-installed
    description: The flaw remediation mechanism is installed
    command: "rpm -q dnf-automatic >/dev/null && echo present"
    expect_output: "present"

  - id: si-01-dnf-automatic-timer
    description: Remediation runs on a schedule
    command: "systemctl is-enabled dnf-automatic.timer 2>&1"
    expect_output: "enabled"

  - id: si-01-upgrade-type-security
    description: Security updates are in scope for automatic remediation
    command: "awk -F= '/^upgrade_type/ {gsub(/ /,\"\",$2); print $2}' /etc/dnf/automatic.conf"
    expect_match: "^(security|default)$"

  - id: si-01-apply-updates
    description: Updates are installed, not merely downloaded
    command: "awk -F= '/^apply_updates/ {gsub(/ /,\"\",$2); print $2}' /etc/dnf/automatic.conf"
    expect_output: "yes"

  - id: si-01-no-pending-security-updates
    description: No security update is outstanding beyond the ODP window
    command: "dnf -q updateinfo list --security 2>/dev/null | grep -c . || true"
    expect_int: "== 0"

  - id: si-01-emit-via
    description: Remediation outcomes are reported
    command: "awk -F= '/^emit_via/ {gsub(/ /,\"\",$2); print $2}' /etc/dnf/automatic.conf"
    expect_match: "\\S"

  - id: si-02-clamav-installed
    description: Signature-based malicious code detection is installed
    command: "rpm -q clamav >/dev/null 2>&1 && echo present || exit 1"
    expect_output: "present"
    manual_if_absent: true

  - id: si-02-freshclam-enabled
    description: Signatures update automatically
    command: |
      # ClamAV comes from EPEL and is opt-in (see nist_clamav_enabled). When it
      # is absent, say so plainly rather than reporting a configuration fault.
      rpm -q clamav-update >/dev/null 2>&1 || { echo "clamav not installed"; exit 1; }
      systemctl is-enabled clamav-freshclam 2>&1
    expect_match: "^(enabled|static)$"
    manual_if_absent: true

  - id: si-02-clamav-scan-timer
    description: Scheduled scanning runs at the ODP frequency
    command: |
      rpm -q clamav >/dev/null 2>&1 || { echo "clamav not installed"; exit 1; }
      systemctl is-enabled nist-malware-scan.timer 2>&1
    expect_output: "enabled"
    manual_if_absent: true

  - id: si-02-signatures-fresh
    description: Malicious code signatures are current (within 7 days)
    command: |
      rpm -q clamav >/dev/null 2>&1 || { echo "clamav not installed"; exit 1; }
      newest=$(find /var/lib/clamav -name '*.c[vl]d' -printf '%T@\n' 2>/dev/null | sort -rn | head -1)
      [ -n "$newest" ] || { echo 999; exit 0; }
      echo $(( ( $(date +%s) - ${newest%.*} ) / 86400 ))
    expect_int: "<= 7"
    manual_if_absent: true

  - id: si-02-fapolicyd-running
    description: Execution-time prevention is active
    command: "systemctl is-active fapolicyd"
    expect_output: "active"

  - id: si-02-scan-action-quarantine
    description: Detections are quarantined rather than left in place
    command: |
      rpm -q clamav >/dev/null 2>&1 || { echo "clamav not installed"; exit 1; }
      grep -c 'move=' /usr/local/sbin/nist-malware-scan 2>/dev/null || echo 0
    expect_int: ">= 1"
    manual_if_absent: true

  - id: si-03-updateinfo-enabled
    description: External advisories reach the host
    command: "dnf -q updateinfo summary >/dev/null 2>&1 && echo available"
    expect_output: "available"

  - id: si-03-alert-mail-configured
    description: An internal alert recipient is configured
    command: "grep -oP '(?<=^ALERT_MAIL=).*' /etc/nist-800-171/alerting.conf 2>/dev/null"
    expect_match: "\\S"

  - id: si-03-aide-alerting
    description: Integrity deviations raise an alert
    command: "grep -c 'logger' /usr/local/sbin/nist-aide-check 2>/dev/null"
    expect_int: ">= 1"

  - id: si-06-audit-login-events
    description: Authentication events are captured for monitoring
    command: |
      # auditctl renders watch rules as `-k <key>` and syscall rules as
      # `key=<key>`; both forms must count.
      auditctl -l 2>/dev/null | grep -cE '(-k|key=) ?logins([[:space:]]|$)' || true
    expect_int: ">= 2"

  - id: si-06-audit-unauth-access
    description: Unauthorized access attempts are captured
    command: |
      # auditctl renders watch rules as `-k <key>` and syscall rules as
      # `key=<key>`; both forms must count.
      auditctl -l 2>/dev/null | grep -cE '(-k|key=) ?unauthorized_access([[:space:]]|$)' || true
    expect_int: ">= 2"

  - id: si-06-firewalld-log-denied
    description: Unauthorized connection attempts are logged
    command: "firewall-cmd --get-log-denied 2>/dev/null"
    expect_match: "^(all|unicast)$"

  - id: si-06-aide-timer-enabled
    description: Unauthorized change is detected on a schedule
    command: "systemctl is-enabled nist-aide-check.timer 2>&1"
    expect_output: "enabled"

  - id: si-06-audit-module-load
    description: Kernel module loading is monitored
    command: |
      # auditctl renders watch rules as `-k <key>` and syscall rules as
      # `key=<key>`; both forms must count.
      auditctl -l 2>/dev/null | grep -cE '(-k|key=) ?module_load([[:space:]]|$)' || true
    expect_int: ">= 2"

  - id: si-06-audit-network-config
    description: Network configuration changes are monitored
    command: |
      # auditctl renders watch rules as `-k <key>` and syscall rules as
      # `key=<key>`; both forms must count.
      auditctl -l 2>/dev/null | grep -cE '(-k|key=) ?network_config([[:space:]]|$)' || true
    expect_int: ">= 3"

  - id: si-08-audit-retention
    description: Audit records are retained for the ODP period
    command: "awk -F= '/^num_logs/ {gsub(/ /,\"\",$2); print $2}' /etc/audit/auditd.conf"
    expect_int: ">= {odp.audit_num_logs}"

  - id: si-08-journald-retention
    description: The journal retains records for the ODP period
    command: "grep -rhoP '(?<=^MaxRetentionSec=)\\d+' /etc/systemd/journald.conf.d/ 2>/dev/null | head -1"
    expect_int: ">= {odp.audit_retention_days}"

  - id: si-08-logrotate-retention
    description: System logs are retained for the ODP period
    command: "grep -rhoP '(?<=maxage )\\d+' /etc/logrotate.d/nist-syslog 2>/dev/null | head -1"
    expect_int: ">= {odp.audit_retention_days}"

  - id: si-08-log-perms
    description: Retained logs are protected from disclosure
    command: |
      # The exposure that matters is access by users outside the owning group,
      # or group *write*. A root:root file at 0640 is not readable by any
      # ordinary user, so it is not flagged.
      find /var/log -maxdepth 1 -type f \( -perm /007 -o -perm /020 \) 2>/dev/null | head -5
    expect_empty: true

# ===========================================================================
# 03.15 PLANNING
# ===========================================================================
  - id: pl-02-ssp-generated
    description: The system security plan has been generated
    command: "test -s /etc/nist-800-171/system-security-plan.md && echo present"
    expect_output: "present"

  - id: pl-02-ssp-perms
    description: The system security plan is protected from disclosure
    command: "stat -c '%a %U' /etc/nist-800-171/system-security-plan.md 2>/dev/null"
    expect_match: "^(600|640) root$"

  - id: pl-02-ssp-current
    description: The plan reflects the current build (within 30 days)
    command: "echo $(( ( $(date +%s) - $(stat -c %Y /etc/nist-800-171/system-security-plan.md 2>/dev/null || echo 0) ) / 86400 ))"
    expect_int: "<= 30"

# ===========================================================================
# 03.16 SYSTEM AND SERVICES ACQUISITION
# ===========================================================================
  - id: sa-02-supported-release
    description: The platform release is within vendor support
    command: "awk '{for(i=1;i<=NF;i++) if($i ~ /^9\\./) {print int($i); exit}}' /etc/rocky-release"
    expect_int: "== 9"

  - id: sa-02-kernel-current
    description: The running kernel is the newest installed kernel
    command: |
      running=$(uname -r)
      newest=$(rpm -q --last kernel 2>/dev/null | head -1 | awk '{print $1}' | sed 's/^kernel-//')
      [ "$running" = "$newest" ] && echo current || echo "running=$running newest=$newest"
    expect_output: "current"

  - id: sa-02-no-unsupported-repos
    description: Only authorized repositories are enabled
    command: |
      dnf -q repolist --enabled 2>/dev/null | tail -n +2 | awk '{print $1}' \
        | grep -vE '^(baseos|appstream|extras|crb|rocky)' || true
    expect_empty: true

  - id: sa-02-no-orphan-packages
    description: No installed package lacks a supporting repository
    command: "dnf -q repoquery --extras --queryformat '%{name}\\n' 2>/dev/null | head -10"
    expect_empty: true

# ===========================================================================
# 03.17 SUPPLY CHAIN RISK MANAGEMENT
# ===========================================================================
  - id: sr-03-gpg-keys-imported
    description: The authorized supplier signing keys are trusted
    command: "rpm -qa gpg-pubkey* 2>/dev/null | wc -l"
    expect_int: ">= 1"

  - id: sr-03-all-packages-signed
    description: Every installed package carries a valid supplier signature
    command: |
      # A handful of packages are laid down by the installer before the GPG
      # keys are imported, so RPM records no signature for them. They come from
      # the same verified install tree; treating them as findings would train
      # the reader to ignore this check. Anything else unsigned is a finding.
      bootstrap='^(filesystem|setup|basesystem|rocky-release|rocky-repos|rocky-gpg-keys|tzdata|hwdata|dnf-data|libreport-filesystem|gawk-all-langpacks|publicsuffix-list-dafsa|ncurses-base|glibc-gconv-extra)$'
      # Packages signed with RSA record the signature in RSAHEADER; SIGPGP is
      # empty for them, so querying only SIGPGP reports every package unsigned.
      rpm -qa --queryformat '%{NAME}|%{SIGPGP:pgpsig}|%{RSAHEADER:pgpsig}\n' 2>/dev/null \
        | awk -F'|' '($2 == "" || $2 == "(none)") && ($3 == "" || $3 == "(none)") {print $1}' \
        | grep -v '^gpg-pubkey' \
        | grep -vE "$bootstrap" | head -10 || true
    expect_empty: true

  - id: sr-03-no-unauthorized-repos
    description: No repository outside the authorized set is configured
    command: |
      dnf -q repolist --enabled 2>/dev/null | tail -n +2 | awk '{print $1}' \
        | grep -vE '^(baseos|appstream|extras|crb|rocky)' || true
    expect_empty: true
