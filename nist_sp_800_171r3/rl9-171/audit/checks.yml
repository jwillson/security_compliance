    expect_int: "<= 3"

  - id: au-08-log-perms
    description: Audit log files are root-only
    command: |
      # Anything at or below 0600 is acceptable; rotation may leave 0400,
      # which is stricter, not weaker.
      find /var/log/audit -name 'audit.log*' \( -perm /077 -o -perm /100 \) 2>/dev/null | head -5
    expect_empty: true

  - id: au-08-log-dir-perms
    description: The audit log directory is not traversable by others
    command: "stat -c '%a' /var/log/audit"
    expect_match: "^(700|750)$"

  - id: au-08-log-owner
    description: Audit logs are owned by root
    command: "find /var/log/audit -name 'audit.log*' ! -user root 2>/dev/null | head -5"
    expect_empty: true

  - id: au-08-conf-perms
    description: The audit configuration is not world-readable
    command: "stat -c '%a' /etc/audit/auditd.conf"
    expect_match: "^(600|640)$"

  - id: au-08-rules-perms
    description: Audit rule files are not world-readable
    command: "find /etc/audit/rules.d -type f -perm /077 2>/dev/null | head -5"
    expect_empty: true

  - id: au-08-tools-perms
    description: Audit tools are not writable by non-root users
    command: "find /sbin/auditctl /sbin/auditd /sbin/ausearch /sbin/aureport /sbin/augenrules -perm /022 2>/dev/null"
    expect_empty: true

  - id: au-08-immutable-rules
    description: Audit rules cannot be changed without a reboot
    command: "auditctl -s 2>/dev/null | awk '/^enabled/ {print $2}'"
    expect_int: "== 2"

  - id: au-08-audit-tool-watch
    description: Modification of the audit tools is itself audited
    command: |
      # auditctl renders watch rules as `-k <key>` and syscall rules as
      # `key=<key>`; both forms must count.
      auditctl -l 2>/dev/null | grep -cE '(-k|key=) ?audit_tools([[:space:]]|$)' || true
    expect_int: ">= 4"

# ===========================================================================
# 03.04 CONFIGURATION MANAGEMENT
# ===========================================================================
  - id: cm-01-aide-installed
    description: The integrity baseline tool is installed
    command: "rpm -q aide >/dev/null && echo present"
    expect_output: "present"

  - id: cm-01-aide-db-exists
    description: A baseline integrity database has been captured
    command: "test -s /var/lib/aide/aide.db.gz && echo present"
    expect_output: "present"

  - id: cm-01-aide-timer
    description: The baseline is re-checked on a schedule
    command: "systemctl is-enabled nist-aide-check.timer 2>&1"
    expect_output: "enabled"

  - id: cm-01-baseline-manifest
    description: The as-built baseline is recorded
    command: "test -f /etc/nist-800-171/build-info && echo present"
    expect_output: "present"

  - id: cm-02-overlay-version-recorded
    description: The applied configuration baseline version is recorded
    command: "grep -oP '(?<=^overlay_version=).*' /etc/nist-800-171/overlay-version 2>/dev/null"
    expect_match: "^\\d+\\.\\d+\\.\\d+$"

  - id: cm-02-no-undocumented-deviations
    description: The role's sysctl settings are the live settings
    command: |
      bad=0
      for f in /etc/sysctl.d/8*-nist-800-171-*.conf; do
        [ -f "$f" ] || continue
        while read -r k _ v; do
          case "$k" in ''|'#'*) continue;; esac
          live=$(sysctl -n "$k" 2>/dev/null | tr -s ' \t' ' ')
          [ "$live" = "$v" ] || { echo "$k: file=$v live=$live"; bad=1; }
        done < <(sed 's/#.*//' "$f" | grep -E '\S+\s*=\s*\S+' | sed 's/=/ = /')
      done
      exit 0
    expect_empty: true

  - id: cm-02-sysctl-applied
    description: The hardened kernel parameter file is present and loaded
    command: "test -f /etc/sysctl.d/81-nist-800-171-kernel.conf && echo present"
    expect_output: "present"

  - id: cm-05-gpgcheck-global
    description: Package signature verification is globally required
    command: "awk -F= '/^gpgcheck/ {gsub(/ /,\"\",$2); print $2}' /etc/dnf/dnf.conf"
    expect_output: "1"

  - id: cm-05-gpgcheck-repos
    description: No repository disables signature verification
    command: "grep -rlE '^\\s*gpgcheck\\s*=\\s*0' /etc/yum.repos.d/ 2>/dev/null"
    expect_empty: true

  - id: cm-05-localpkg-gpgcheck
    description: Locally installed packages must also be signed
    command: "awk -F= '/^localpkg_gpgcheck/ {gsub(/ /,\"\",$2); print $2}' /etc/dnf/dnf.conf"
    expect_output: "1"

  - id: cm-05-repo-perms
    description: Repository definitions are not writable by non-root users
    command: "find /etc/yum.repos.d -type f -perm /022 2>/dev/null | head -5"
    expect_empty: true

  - id: cm-05-audit-config-changes
    description: Changes to configuration are audited
    command: |
      # auditctl renders watch rules as `-k <key>` and syscall rules as
      # `key=<key>`; both forms must count.
      auditctl -l 2>/dev/null | grep -cE '(-k|key=) ?config_change([[:space:]]|$)' || true
    expect_int: ">= 5"

  - id: cm-06-no-legacy-services
    description: Legacy network services are not installed
    command: "rpm -qa telnet-server rsh-server ypserv tftp-server xinetd vsftpd 2>/dev/null"
    expect_empty: true

  - id: cm-06-no-cleartext-clients
    description: Cleartext network clients are not installed
    command: "rpm -qa telnet rsh ypbind tftp talk 2>/dev/null"
    expect_empty: true

  - id: cm-06-fs-modules-blocked
    description: Unnecessary filesystem drivers cannot be loaded
    command: |
      for m in cramfs freevxfs jffs2 hfs hfsplus udf; do
        modprobe -n -v "$m" 2>&1 | grep -qE 'install /bin/false|not found' || echo "loadable:$m"
      done
    expect_empty: true

  - id: cm-06-net-protocols-blocked
    description: Uncommon network protocols cannot be loaded
    command: |
      for m in dccp sctp rds tipc; do
        modprobe -n -v "$m" 2>&1 | grep -qE 'install /bin/false|not found' || echo "loadable:$m"
      done
    expect_empty: true

  - id: cm-06-mount-options
    description: Separate filesystems carry nodev/nosuid/noexec as required
    command: |
      check() { findmnt -no OPTIONS "$1" 2>/dev/null | grep -q "$2" || echo "$1 missing $2"; }
      check /tmp nosuid; check /tmp nodev; check /tmp noexec
      check /var/tmp nosuid; check /var/tmp nodev; check /var/tmp noexec
      check /var/log nodev; check /var/log nosuid
      check /var/log/audit nodev; check /var/log/audit nosuid
      check /home nodev; check /home nosuid
      check /dev/shm nodev; check /dev/shm nosuid; check /dev/shm noexec
    expect_empty: true

  - id: cm-06-tmp-separate
    description: /tmp and the audit log are on their own filesystems
    command: |
      for m in /tmp /var/log/audit; do
        findmnt -no TARGET "$m" >/dev/null 2>&1 || echo "not-separate:$m"
      done
    expect_empty: true

  - id: cm-06-no-listening-extras
    description: No unexpected service is listening on a network socket
    command: |
      # Authorized ports are declared on the host, one fragment per role,
      # by whatever opened them. Reading them here keeps the check honest: a
      # collector's 514 is authorized, the same port on a plain CUI host is
      # still a finding.
      auth=$(cat /etc/nist-800-171/authorized-ports.d/* 2>/dev/null \
               | grep -oE '^[0-9]+' | sort -un | paste -sd'|')
      auth=${auth:-22}
      ss -tlnH 2>/dev/null | awk '{print $4}' | sed 's/.*://' | sort -un \
        | grep -vE "^(${auth})$" || true
    expect_empty: true

  - id: cm-06-ctrlaltdel-masked
    description: Ctrl-Alt-Del cannot reboot the host from the console
    command: "systemctl is-enabled ctrl-alt-del.target 2>&1"
    expect_match: "(masked|not-found|No such file)"

  - id: cm-08-fapolicyd-installed
    description: The execution control mechanism is installed
    command: "rpm -q fapolicyd >/dev/null && echo present"
