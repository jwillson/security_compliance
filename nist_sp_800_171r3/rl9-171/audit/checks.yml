    command: "systemctl is-enabled fapolicyd 2>&1"
    expect_output: "enabled"

  - id: cm-08-fapolicyd-running
    description: Execution control is active
    command: "systemctl is-active fapolicyd"
    expect_output: "active"

  - id: cm-08-fapolicyd-deny-default
