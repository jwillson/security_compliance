# Verification checks for the NIST SP 800-171r3 Rocky 9 overlay.
#
# These are written to be independent of the Ansible role: each one inspects
# the running system's effective state rather than the file the role wrote,
# wherever the two can differ. `sshd -T` is preferred over reading
# sshd_config, `sysctl` over reading sysctl.d, `auditctl -l` over reading
# rules.d, and `systemctl is-enabled` over reading unit files.
#
# Assertion forms (exactly one per check):
#   expect_rc        command exit status equals this
#   expect_output    stdout equals this string exactly
#   expect_match     stdout matches this regex (multiline)
#   expect_no_match  stdout does not match this regex
#   expect_empty     stdout is empty
#   expect_int       first integer in stdout satisfies "<op> <value>"
#
# {odp.name} expands from the overlay's odp block, so a policy change in the
# overlay updates the role and these checks together.
#
# manual_if_absent: true  -> a missing optional component degrades to MANUAL
#                            rather than counting as a deviation.

checks:

# ===========================================================================
# 03.01 ACCESS CONTROL
# ===========================================================================
  - id: ac-01-inactive-default
    description: New accounts inherit the ODP inactivity disable period
    command: "useradd -D | grep -oP '(?<=^INACTIVE=).*'"
    expect_int: "== {odp.account_inactivity_days}"

  - id: ac-01-inactive-users
    description: Every interactive account has the inactivity lock applied
    command: |
      # Field 7 of /etc/shadow is the inactivity period and field 3 the last
      # change date. Both must be set: with no last-change date the aging
      # fields are inert, which `chage -l` hides by printing "never".
      for u in $(awk -F: '($3>=1000 && $3!=65534 && $7 !~ /(nologin|false)$/){print $1}' /etc/passwd); do
        awk -F: -v u="$u" '$1==u { if ($7=="" || $3=="") print u }' /etc/shadow
      done
    expect_empty: true

  - id: ac-01-nologin-shells
    description: System accounts cannot obtain an interactive shell
    command: |
      # /sbin and /usr/sbin are the same directory under the /usr merge, so
      # both spellings of nologin are the same binary. Packages disagree about
      # which one they write into /etc/passwd - clevis ships /usr/sbin/nologin
      # while most others ship /sbin/nologin - and treating one as a finding
      # is a false positive, not a hardening gap.
      awk -F: '($3<1000 && $1!="root" && $1!="sync" &&
                $7!="/sbin/nologin" && $7!="/usr/sbin/nologin" &&
                $7!="/bin/false"  && $7!="/usr/bin/false"){print $1}' /etc/passwd
    expect_empty: true

  - id: ac-01-audit-account-events
    description: Account lifecycle changes are audited
    command: |
      # auditctl renders watch rules as `-k <key>` and syscall rules as
      # `key=<key>`; both forms must count.
      auditctl -l 2>/dev/null | grep -cE '(-k|key=) ?identity([[:space:]]|$)' || true
    expect_int: ">= 4"

  - id: ac-01-no-legacy-accounts
    description: Unused default accounts have been removed
    command: "getent passwd games gopher ftp uucp operator 2>/dev/null | cut -d: -f1"
    expect_empty: true

  - id: ac-02-selinux-enforcing
    description: SELinux is enforcing (the access enforcement mechanism)
    command: "getenforce"
    expect_output: "Enforcing"

  - id: ac-02-selinux-policy
    description: The targeted SELinux policy is loaded
    command: "sestatus | awk -F: '/Loaded policy name/ {print $2}' | xargs"
    expect_output: "targeted"

  - id: ac-02-no-unowned
    description: No file lacks a valid owner or group
    command: "find / -xdev \\( -nouser -o -nogroup \\) -print 2>/dev/null | head -20"
    expect_empty: true

  - id: ac-02-world-writable-sticky
    description: Every world-writable directory carries the sticky bit
    command: "find / -xdev -type d -perm -0002 ! -perm -1000 -print 2>/dev/null | head -20"
    expect_empty: true

  - id: ac-02-passwd-perms
    description: /etc/passwd is 0644 root:root
    command: "stat -c '%a %U:%G' /etc/passwd"
    expect_output: "644 root:root"

  - id: ac-02-shadow-perms
    description: /etc/shadow is unreadable by anyone but root
    command: "stat -c '%a %U:%G' /etc/shadow"
    expect_match: "^(0|000|400) root:root$"

  - id: ac-03-ip-forward
    description: The host does not forward IP traffic between networks
    command: "sysctl -n net.ipv4.ip_forward"
    expect_output: "0"

  - id: ac-03-send-redirects
    description: The host does not send ICMP redirects
    command: "sysctl -n net.ipv4.conf.all.send_redirects net.ipv4.conf.default.send_redirects | sort -u"
    expect_output: "0"

  - id: ac-03-accept-redirects
    description: The host ignores ICMP redirects
    command: "sysctl -n net.ipv4.conf.all.accept_redirects net.ipv4.conf.default.accept_redirects | sort -u"
    expect_output: "0"

  - id: ac-03-accept-source-route
    description: Source-routed packets are rejected
    command: "sysctl -n net.ipv4.conf.all.accept_source_route net.ipv4.conf.default.accept_source_route | sort -u"
    expect_output: "0"

  - id: ac-03-rp-filter
    description: Reverse path filtering is enabled
    command: "sysctl -n net.ipv4.conf.all.rp_filter"
    expect_int: ">= 1"

  - id: ac-03-firewalld-active
    description: firewalld is enforcing flow control
    command: "systemctl is-active firewalld"
    expect_output: "active"

  - id: ac-04-audit-group-exists
    description: A distinct audit administration group exists
    command: "getent group auditadm >/dev/null && echo present"
    expect_output: "present"

  - id: ac-04-audit-group-distinct
    description: Audit administration is not the same group as sysadmin
    command: "test \"$(getent group auditadm | cut -d: -f3)\" != \"$(getent group wheel | cut -d: -f3)\" && echo distinct"
    expect_output: "distinct"

  - id: ac-05-sudo-no-nopasswd
    description: No sudo rule grants privilege without authentication
    command: "grep -rE '^[^#]*NOPASSWD' /etc/sudoers /etc/sudoers.d/ 2>/dev/null"
    expect_empty: true

  - id: ac-05-sudo-no-authenticate-off
    description: No sudo rule disables authentication with !authenticate
    command: "grep -rE '^[^#]*!authenticate' /etc/sudoers /etc/sudoers.d/ 2>/dev/null"
    expect_empty: true

  - id: ac-05-sudo-timestamp-timeout
    description: sudo re-authenticates rather than caching credentials
    command: "grep -rhoP '(?<=timestamp_timeout=)\\S+' /etc/sudoers /etc/sudoers.d/ 2>/dev/null | head -1"
    expect_int: "<= 0"

  - id: ac-05-umask-login-defs
    description: The default umask denies group and other access
    command: "grep -iE '^\\s*UMASK' /etc/login.defs | awk '{print $2}'"
    expect_match: "^0?77$"

  - id: ac-05-sudoers-perms
    description: The sudo policy files cannot be modified by non-root users
    command: "find /etc/sudoers /etc/sudoers.d -type f ! -perm 0440 ! -perm 0400 2>/dev/null"
    expect_empty: true

  - id: ac-05-privilege-report
    description: The privileged access review report is installed
    command: "test -x /usr/local/sbin/nist-privilege-report && echo present"
    expect_output: "present"

  - id: ac-06-ssh-permitrootlogin
    description: Direct root login over SSH is refused
    command: "sshd -T 2>/dev/null | awk '/^permitrootlogin/ {print $2}'"
    expect_output: "no"

  - id: ac-06-pam-wheel-su
    description: su is restricted to the administrative group
    command: "grep -E '^\\s*auth\\s+required\\s+pam_wheel\\.so.*use_uid' /etc/pam.d/su"
    expect_match: "pam_wheel"

  - id: ac-06-single-uid0
    description: Only root holds UID 0
    command: "awk -F: '($3==0 && $1!=\"root\"){print $1}' /etc/passwd"
    expect_empty: true

  - id: ac-06-no-empty-passwords
    description: No account can authenticate with an empty password
    command: "awk -F: '($2==\"\"){print $1}' /etc/shadow"
    expect_empty: true

  - id: ac-07-audit-privileged-execve
    description: Privileged (setuid) program execution is audited
    command: |
      # auditctl renders watch rules as `-k <key>` and syscall rules as
      # `key=<key>`; both forms must count.
      auditctl -l 2>/dev/null | grep -cE '(-k|key=) ?privileged_exec([[:space:]]|$)' || true
    expect_int: ">= 5"

  - id: ac-07-audit-sudo-log
    description: The sudo I/O log exists and is root-only
    command: "stat -c '%a %U' /var/log/sudo.log 2>/dev/null"
    expect_match: "^(600|640) root$"

  - id: ac-07-audit-execpriv-rules
    description: execve by escalated euid is captured on both ABIs
    command: "auditctl -l 2>/dev/null | grep -c 'euid=0.*execve\\|execve.*euid=0'"
    expect_int: ">= 2"

  - id: ac-08-faillock-deny
    description: Account lockout triggers at the ODP attempt count
    command: "grep -oP '(?<=^deny\\s=\\s).*|(?<=^deny=).*' /etc/security/faillock.conf | head -1"
    expect_int: "<= {odp.lockout_attempts}"

  - id: ac-08-faillock-interval
    description: Failed attempts are counted over the ODP window
    command: "grep -oP '(?<=^fail_interval\\s=\\s).*|(?<=^fail_interval=).*' /etc/security/faillock.conf | head -1"
    expect_int: ">= {odp.lockout_window_seconds}"

  - id: ac-08-faillock-unlock
    description: The lockout lasts at least the ODP duration
    command: "grep -oP '(?<=^unlock_time\\s=\\s).*|(?<=^unlock_time=).*' /etc/security/faillock.conf | head -1"
    expect_int: ">= {odp.lockout_duration_seconds}"

  - id: ac-08-faillock-even-deny-root
    description: The lockout applies to root as well
    command: "grep -cE '^\\s*even_deny_root' /etc/security/faillock.conf"
    expect_int: ">= 1"

  - id: ac-08-faillock-in-pam
    description: pam_faillock is active in both authentication stacks
    command: "grep -lc pam_faillock /etc/pam.d/system-auth /etc/pam.d/password-auth 2>/dev/null | wc -l"
    expect_int: ">= 2"

  - id: ac-08-faillock-dir-context
    description: The faillock state directory carries the label pam_faillock may write to
    command: |
      # The tally is kept under /var/log so it survives a reboot. Under the
      # targeted policy that path is var_log_t, and pam_faillock is confined
      # to faillog_t: with the wrong label the first failed authentication
      # creates a tally no PAM stack can read again, and sudo stops working.
      d=$(grep -oP '(?<=^dir\s=\s).*|(?<=^dir=).*' /etc/security/faillock.conf | head -1)
      stat -c '%C' "${d:-/var/run/faillock}" 2>/dev/null | grep -o 'faillog_t'
    expect_output: "faillog_t"

  - id: ac-08-faillock-dir
    description: The faillock state directory exists
    command: "test -d /var/log/faillock && echo present"
    expect_output: "present"

  - id: ac-09-issue
    description: The console displays the use notification before login
    command: "grep -c 'Government information system\\|Unauthorized' /etc/issue"
    expect_int: ">= 1"

  - id: ac-09-issue-net
    description: Network logins display the use notification before auth
    command: "grep -c 'Government information system\\|Unauthorized' /etc/issue.net"
    expect_int: ">= 1"

  - id: ac-09-motd
    description: A post-login notification is present
    command: "test -s /etc/motd && echo present"
    expect_output: "present"

  - id: ac-09-sshd-banner
    description: sshd presents the banner before authentication
    command: "sshd -T 2>/dev/null | awk '/^banner/ {print $2}'"
    expect_output: "/etc/issue.net"

  - id: ac-10-tmout-set
    description: Idle shell sessions time out at the ODP period
    command: "grep -rhoP '(?<=^TMOUT=)\\d+' /etc/profile /etc/profile.d/ 2>/dev/null | sort -n | head -1"
    expect_int: "<= {odp.idle_lock_seconds}"

  - id: ac-10-tmout-readonly
    description: A user cannot extend their own idle timeout
    command: "grep -rh 'readonly TMOUT' /etc/profile.d/ /etc/profile 2>/dev/null | grep -c . || true"
    expect_int: ">= 1"

  - id: ac-10-tmux-lock
    description: tmux locks the terminal after the ODP idle period
    command: "grep -oP '(?<=lock-after-time )\\d+' /etc/tmux.conf 2>/dev/null"
    expect_int: "<= {odp.idle_lock_seconds}"

  - id: ac-10-tmux-installed
    description: The session lock mechanism is installed
    command: "rpm -q tmux >/dev/null && echo present"
    expect_output: "present"

  - id: ac-11-tmout-set
    description: Sessions terminate automatically on idle expiry
    command: "grep -rhoP '(?<=^TMOUT=)\\d+' /etc/profile /etc/profile.d/ 2>/dev/null | sort -n | head -1"
    expect_int: "<= {odp.session_timeout_seconds}"

  - id: ac-11-ssh-clientalive-interval
    description: sshd drops idle sessions at the ODP interval
    command: "sshd -T 2>/dev/null | awk '/^clientaliveinterval/ {print $2}'"
    expect_int: "<= {odp.ssh_client_alive_interval}"

  - id: ac-11-ssh-clientalive-countmax
    description: sshd terminates rather than probing indefinitely
    command: "sshd -T 2>/dev/null | awk '/^clientalivecountmax/ {print $2}'"
    expect_int: "<= {odp.ssh_client_alive_count_max}"

  - id: ac-11-ssh-logingracetime
    description: Unauthenticated connections are bounded
    command: "sshd -T 2>/dev/null | awk '/^logingracetime/ {print $2}'"
    expect_int: "<= 120"

  - id: ac-12-sshd-active
    description: The managed remote access daemon is running
    command: "systemctl is-active sshd"
    expect_output: "active"

  - id: ac-12-sshd-no-empty-passwords
    description: sshd refuses accounts with empty passwords
    command: "sshd -T 2>/dev/null | awk '/^permitemptypasswords/ {print $2}'"
    expect_output: "no"

  - id: ac-12-sshd-hostbased
    description: Host-based authentication is disabled
    command: "sshd -T 2>/dev/null | awk '/^hostbasedauthentication/ {print $2}'"
    expect_output: "no"

  - id: ac-12-sshd-gssapi
    description: GSSAPI authentication is disabled
    command: "sshd -T 2>/dev/null | awk '/^gssapiauthentication/ {print $2}'"
    expect_output: "no"

  - id: ac-12-sshd-strictmodes
    description: sshd enforces ownership checks on user files
    command: "sshd -T 2>/dev/null | awk '/^strictmodes/ {print $2}'"
    expect_output: "yes"

  - id: ac-12-sshd-ignorerhosts
    description: rhosts-style trust is ignored
    command: "sshd -T 2>/dev/null | awk '/^ignorerhosts/ {print $2}'"
    expect_output: "yes"

  - id: ac-12-sshd-permituserenv
    description: Users cannot inject environment settings at login
    command: "sshd -T 2>/dev/null | awk '/^permituserenvironment/ {print $2}'"
    expect_output: "no"

  - id: ac-12-sshd-x11forwarding
    description: X11 forwarding is disabled
    command: "sshd -T 2>/dev/null | awk '/^x11forwarding/ {print $2}'"
    expect_output: "no"

  - id: ac-12-sshd-maxauthtries
    description: Authentication attempts per connection are bounded
    command: "sshd -T 2>/dev/null | awk '/^maxauthtries/ {print $2}'"
    expect_int: "<= {odp.lockout_attempts}"

  - id: ac-12-sshd-config-perms
    description: The sshd configuration is root-only
    command: "stat -c '%a %U' /etc/ssh/sshd_config"
    expect_match: "^(600|0600) root$"

  - id: ac-12-sshd-crypto-policy
    description: sshd inherits the system-wide crypto policy
    command: "grep -rc 'CRYPTO_POLICY' /etc/sysconfig/sshd 2>/dev/null | head -1"
    expect_int: ">= 0"

  - id: ac-16-bluetooth-module
    description: The Bluetooth module cannot be loaded
    command: "modprobe -n -v bluetooth 2>&1 | head -1"
    expect_match: "(install /bin/false|not found|blacklist)"

  - id: ac-16-bluetooth-service
    description: The Bluetooth service is masked
    command: "systemctl is-enabled bluetooth 2>&1"
    expect_match: "(masked|disabled|not-found|No such file)"

  - id: ac-16-wifi-module
    description: Wireless networking capability is disabled
    command: "test -z \"$(nmcli -t -f TYPE device 2>/dev/null | grep -x wifi)\" && echo none"
    expect_output: "none"

  - id: ac-16-no-active-wireless
    description: No wireless interface is active
    command: "ip -o link show 2>/dev/null | grep -ci 'wl' || true"
    expect_int: "== 0"

  - id: ac-18-luks-root-or-data
    description: CUI is held on an encrypted volume
    command: "lsblk -o TYPE 2>/dev/null | grep -c crypt"
    expect_int: ">= 1"

  - id: ac-20-usb-storage-blocked
    description: USB mass storage cannot be used
    command: "modprobe -n -v usb-storage 2>&1 | head -1"
    expect_match: "(install /bin/false|not found|blacklist)"

  - id: ac-20-autofs-disabled
    description: Automounting of external media is disabled
    command: "systemctl is-enabled autofs 2>&1"
    expect_match: "(masked|disabled|not-found|No such file)"

# ===========================================================================
# 03.03 AUDIT AND ACCOUNTABILITY
# ===========================================================================
  - id: au-01-auditd-enabled
    description: auditd starts at boot
    command: "systemctl is-enabled auditd 2>&1"
    expect_output: "enabled"

  - id: au-01-auditd-running
    description: auditd is currently running
    command: "systemctl is-active auditd"
    expect_output: "active"

  - id: au-01-audit-grub
    description: Auditing is active before auditd starts
    command: "grep -c 'audit=1' /proc/cmdline"
    expect_int: ">= 1"

  - id: au-01-audit-backlog
    description: The early-boot audit backlog is large enough not to drop events
    command: "grep -oP '(?<=audit_backlog_limit=)\\d+' /proc/cmdline | head -1"
    expect_int: ">= 8192"

  - id: au-01-rules-loaded
    description: A substantial audit rule set is loaded in the kernel
    command: "auditctl -l 2>/dev/null | grep -vc '^No rules'"
    expect_int: ">= 40"

  - id: au-01-rsyslog-enabled
    description: rsyslog is enabled for event collection
    command: "systemctl is-enabled rsyslog 2>&1"
    expect_output: "enabled"

  - id: au-02-log-format-enriched
    description: Records resolve identity at write time (ENRICHED)
    command: "awk -F= '/^log_format/ {gsub(/ /,\"\",$2); print $2}' /etc/audit/auditd.conf"
    expect_output: "ENRICHED"

  - id: au-02-name-format
    description: Records carry the originating host name
    command: "awk -F= '/^name_format/ {gsub(/ /,\"\",$2); print $2}' /etc/audit/auditd.conf"
    expect_match: "^(hostname|fqd|numeric)$"

  - id: au-02-record-fields
    description: Emitted records contain type, time, and subject identity
    command: |
      # Read the records the kernel actually wrote rather than relying on
      # ausearch's time filters. A conforming record carries the event type,
      # a timestamp, and the subject identity.
      r=$(tail -50 /var/log/audit/audit.log 2>/dev/null)
      [ -n "$r" ] || { echo 0; exit 0; }
      n=0
      # `name_format = hostname` prepends `node=<host>`, so the type field is
      # not at the start of the line - that prefix is the 03.03.02 control
      # working, not a missing field.
      printf '%s\n' "$r" | grep -qE '(^|[[:space:]])type=' && n=$((n+1))
      printf '%s\n' "$r" | grep -q 'msg=audit('  && n=$((n+1))
      printf '%s\n' "$r" | grep -qE 'auid=|uid=' && n=$((n+1))
      echo "$n"
    expect_int: ">= 3"

  - id: au-03-max-log-file
    description: Audit log rotation size matches the ODP
    command: "awk -F= '/^max_log_file / {gsub(/ /,\"\",$2); print $2}' /etc/audit/auditd.conf"
    expect_int: ">= {odp.audit_max_log_file_mb}"

  - id: au-03-num-logs
    description: Enough rotated files are retained for the ODP window
    command: "awk -F= '/^num_logs/ {gsub(/ /,\"\",$2); print $2}' /etc/audit/auditd.conf"
    expect_int: ">= {odp.audit_num_logs}"

  - id: au-03-max-log-file-action
    description: Logs rotate rather than being overwritten or ignored
    command: "awk -F= '/^max_log_file_action/ {gsub(/ /,\"\",$2); print toupper($2)}' /etc/audit/auditd.conf"
    expect_output: "ROTATE"

  - id: au-03-retention-capacity
    description: Configured capacity can hold the ODP retention period
    command: |
      n=$(awk -F= '/^num_logs/ {gsub(/ /,"",$2); print $2}' /etc/audit/auditd.conf)
      s=$(awk -F= '/^max_log_file / {gsub(/ /,"",$2); print $2}' /etc/audit/auditd.conf)
      echo $(( n * s ))
    expect_int: ">= 500"

  - id: au-03-logrotate-present
    description: A retention policy exists for rotated audit logs
    command: "test -f /etc/logrotate.d/nist-audit && echo present"
    expect_output: "present"

  - id: au-04-space-left
    description: A low-space alert threshold is set
    command: "awk -F= '/^space_left / {gsub(/ /,\"\",$2); print $2}' /etc/audit/auditd.conf"
    expect_int: ">= {odp.audit_space_left_mb}"

  - id: au-04-space-left-action
    description: Low space raises an alert rather than being ignored
    command: "awk -F= '/^space_left_action/ {gsub(/ /,\"\",$2); print toupper($2)}' /etc/audit/auditd.conf"
    expect_match: "^(SYSLOG|EMAIL|EXEC|SINGLE|HALT)$"

  - id: au-04-admin-space-left
    description: A critical-space threshold is set
    command: "awk -F= '/^admin_space_left / {gsub(/ /,\"\",$2); print $2}' /etc/audit/auditd.conf"
    expect_int: ">= {odp.audit_admin_space_left_mb}"

  - id: au-04-admin-space-left-action
    description: Critical space takes a protective action
    command: "awk -F= '/^admin_space_left_action/ {gsub(/ /,\"\",$2); print toupper($2)}' /etc/audit/auditd.conf"
    expect_match: "^(SINGLE|HALT)$"

  - id: au-04-disk-full-action
    description: A full audit disk halts processing rather than losing records
    command: "awk -F= '/^disk_full_action/ {gsub(/ /,\"\",$2); print toupper($2)}' /etc/audit/auditd.conf"
    expect_match: "^(SINGLE|HALT)$"

  - id: au-04-disk-error-action
    description: An audit write error takes a protective action
    command: "awk -F= '/^disk_error_action/ {gsub(/ /,\"\",$2); print toupper($2)}' /etc/audit/auditd.conf"
    expect_match: "^(SINGLE|HALT|SYSLOG)$"

  - id: au-04-failure-mode
    description: The kernel panics rather than silently dropping audit records
    command: "auditctl -s 2>/dev/null | awk '/^failure/ {print $2}'"
    expect_int: ">= 1"

  - id: au-04-action-mail-acct
    description: An audit administrator is named for alerts
    command: "awk -F= '/^action_mail_acct/ {gsub(/ /,\"\",$2); print $2}' /etc/audit/auditd.conf"
    expect_match: "\\S"

  - id: au-05-review-timer
    description: The scheduled audit review is installed
    command: "test -f /etc/systemd/system/nist-audit-review.timer && echo present"
    expect_output: "present"

  - id: au-05-review-timer-enabled
    description: The audit review runs on schedule
    command: "systemctl is-enabled nist-audit-review.timer 2>&1"
    expect_output: "enabled"

  - id: au-05-aureport-present
    description: The audit reduction and reporting tools are available
    command: "command -v aureport >/dev/null && command -v ausearch >/dev/null && echo present"
    expect_output: "present"

  - id: au-05-rsyslog-forwarding
    description: Records are forwarded for cross-repository correlation
    # Anchored to the line start: the stock rsyslog.conf ships a commented
    # `#action(type="omfwd"` example that must not count.
    command: "grep -rhE '^\\s*(\\*\\.\\*\\s+@|action\\(type=\"omfwd\")' /etc/rsyslog.d/ /etc/rsyslog.conf 2>/dev/null | head -1"
    expect_match: "@|omfwd"
    manual_if_absent: true

  - id: au-05-forward-established
    description: The forwarding connection to the collector is live
    command: |
      # The rule above only proves a line was written. rsyslog queues to disk
      # when the collector is unreachable, so a host can look configured and
      # be forwarding nothing. Read the socket instead.
      # A collector that is configured but cannot be used (TLS required, no
      # certificate) is a deviation, not the single-node case.
      status=$(sed -n 's/^status=//p' /etc/nist-800-171/log-forwarding-status 2>/dev/null)
      [ "$status" = tls-certificate-missing ] && { echo "collector configured, no certificate"; exit 0; }
      conf=$(grep -rlE '^[[:space:]]*(\*\.\*[[:space:]]+@|action\(type="omfwd")' \
               /etc/rsyslog.d/ /etc/rsyslog.conf 2>/dev/null | head -1)
      # No collector configured is not a failure of this host - it is the
      # single-node case. Exit non-zero so manual_if_absent reports MANUAL.
      [ -n "$conf" ] || { echo "no collector configured"; exit 1; }
      # Either syntax: action(... port="6514") or the legacy *.* @@host:port.
      port=$(grep -oE 'port="[0-9]+"' "$conf" 2>/dev/null | head -1 | grep -oE '[0-9]+')
      [ -n "$port" ] || port=$(grep -oE '@@?[^[:space:]]+' "$conf" | head -1 | grep -oE ':[0-9]+$' | tr -d :)
      port=${port:-514}
      if ss -tnH state established "( dport = :$port )" 2>/dev/null | grep -q .; then
        echo established
      else
        echo "not established on port $port"
      fi
    expect_output: "established"
    manual_if_absent: true

  - id: au-05-collector-receiving
    description: A collector host is storing records received from other hosts
    command: |
      # Only meaningful on the collector. Elsewhere there is no collector
      # config, so this reports MANUAL rather than a deviation.
      [ -f /etc/rsyslog.d/10-nist-collector.conf ] || \
        { echo "not a collector"; exit 1; }
      dir=$(sed -n 's/^directory=//p' \
              /etc/nist-800-171/log-collector-status 2>/dev/null)
      dir=${dir:-/var/log/nist-remote}
      # A record from some host other than this one is what proves the path.
      found=$(find "$dir" -mindepth 2 -name '*.log' -size +0 \
                ! -path "*/$(hostname -s)/*" 2>/dev/null | head -1)
      [ -n "$found" ] && echo receiving || echo "no remote records in $dir"
    expect_output: "receiving"
    manual_if_absent: true

  - id: au-06-audit-tools-present
