  - id: ia-07-minlen
    description: Passwords meet the ODP minimum length
    command: "grep -oP '(?<=^minlen\\s=\\s)\\d+|(?<=^minlen=)\\d+' /etc/security/pwquality.conf | head -1"
    expect_int: ">= {odp.password_min_length}"

  - id: ia-07-dcredit
    description: Passwords require a digit
    command: "grep -oP '(?<=^dcredit\\s=\\s)-?\\d+|(?<=^dcredit=)-?\\d+' /etc/security/pwquality.conf | head -1"
    expect_int: "<= {odp.password_dcredit}"

  - id: ia-07-ucredit
    description: Passwords require an upper-case character
    command: "grep -oP '(?<=^ucredit\\s=\\s)-?\\d+|(?<=^ucredit=)-?\\d+' /etc/security/pwquality.conf | head -1"
    expect_int: "<= {odp.password_ucredit}"

