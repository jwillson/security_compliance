    command: "awk '/^\\s*ENCRYPT_METHOD/ {print $2}' /etc/login.defs"
    expect_output: "SHA512"

  - id: ia-07-hash-rounds
    description: The hash uses the ODP work factor
    command: "awk '/^\\s*SHA_CRYPT_MIN_ROUNDS/ {print $2}' /etc/login.defs"
    expect_int: ">= {odp.password_hash_rounds}"

  - id: ia-07-shadow-hashes
    description: Every stored password is a strong hash, not a legacy one
    command: "awk -F: '($2!~/^[*!]/ && $2!=\"\" && $2!~/^\\$6\\$|^\\$y\\$/){print $1}' /etc/shadow"
    expect_empty: true

  - id: ia-07-pwquality-in-pam
    description: Password quality is enforced by the PAM stack
    command: "grep -lc pam_pwquality /etc/pam.d/system-auth /etc/pam.d/password-auth 2>/dev/null | wc -l"
    expect_int: ">= 1"

  - id: ia-07-enforce-for-root
    description: The password policy applies to root as well
    command: "grep -c '^enforce_for_root' /etc/security/pwquality.conf"
    expect_int: ">= 1"

  - id: ia-11-sudo-no-pwfeedback
    description: sudo does not echo password input
    command: "grep -rE '^[^#]*Defaults.*[^!]pwfeedback' /etc/sudoers /etc/sudoers.d/ 2>/dev/null"
    expect_empty: true

  - id: ia-11-sudo-no-visiblepw
    description: sudo refuses to run when input would be visible
    command: "grep -rE '^[^#]*Defaults.*[^!]visiblepw' /etc/sudoers /etc/sudoers.d/ 2>/dev/null"
    expect_empty: true

  - id: ia-11-gdm-no-user-list
    description: The graphical greeter does not enumerate accounts
    command: "test ! -x /usr/sbin/gdm && echo no-gui || grep -rc 'disable-user-list=true' /etc/dconf/db/gdm.d/ 2>/dev/null"
    expect_match: "(no-gui|^[1-9])"

  - id: ia-12-pass-max-days
    description: Authenticators expire within the ODP lifetime
    command: "awk '/^\\s*PASS_MAX_DAYS/ {print $2}' /etc/login.defs"
    expect_int: "<= {odp.password_max_age}"

  - id: ia-12-pass-min-days
    description: A minimum age prevents cycling through the history
    command: "awk '/^\\s*PASS_MIN_DAYS/ {print $2}' /etc/login.defs"
    expect_int: ">= {odp.password_min_age}"

  - id: ia-12-pass-warn-age
    description: Users are warned before their authenticator expires
    command: "awk '/^\\s*PASS_WARN_AGE/ {print $2}' /etc/login.defs"
    expect_int: ">= {odp.password_warn_age}"

  - id: ia-12-existing-max-days
    description: Existing accounts carry the ODP maximum age
    command: |
      for u in $(awk -F: '($3>=1000 && $3!=65534 && $7 !~ /(nologin|false)$/){print $1}' /etc/passwd); do
        v=$(chage -l "$u" 2>/dev/null | awk -F: '/Maximum number/ {gsub(/ /,"",$2); print $2}')
        case "$v" in ''|never) echo "$u:unset";; *) [ "$v" -gt {odp.password_max_age} ] && echo "$u:$v";; esac
      done
    expect_empty: true

  - id: ia-12-existing-min-days
    description: Existing accounts carry the ODP minimum age
    command: |
      for u in $(awk -F: '($3>=1000 && $3!=65534 && $7 !~ /(nologin|false)$/){print $1}' /etc/passwd); do
        v=$(chage -l "$u" 2>/dev/null | awk -F: '/Minimum number/ {gsub(/ /,"",$2); print $2}')
        case "$v" in ''|never) echo "$u:unset";; *) [ "$v" -lt {odp.password_min_age} ] && echo "$u:$v";; esac
      done
    expect_empty: true

  - id: ia-12-no-never-expire
    description: No interactive account has a non-expiring authenticator
    command: |
      awk -F: '($2 ~ /^\$/ && ($5=="" || $5=="99999")){print $1}' /etc/shadow \
        | while read -r u; do
            uid=$(id -u "$u" 2>/dev/null || echo 0)
            [ "$uid" -ge 1000 ] && echo "$u"
          done
    expect_empty: true

  - id: ia-12-shadow-perms
    description: The authenticator store is unreadable by non-root users
    command: "stat -c '%a' /etc/shadow"
    expect_match: "^(0|000|400)$"

  - id: ia-12-gshadow-perms
    description: The group authenticator store is unreadable by non-root users
    command: "stat -c '%a' /etc/gshadow"
    expect_match: "^(0|000|400)$"

# ===========================================================================
# 03.06 INCIDENT RESPONSE
# ===========================================================================
  - id: ir-02-journald-persistent
    description: System records survive a reboot
    command: "grep -rhoP '(?<=^Storage=)\\w+' /etc/systemd/journald.conf.d/ /etc/systemd/journald.conf 2>/dev/null | head -1"
    expect_output: "persistent"

  - id: ir-02-journald-retention
    description: The journal has a defined retention period
    command: "grep -rh 'MaxRetentionSec' /etc/systemd/journald.conf.d/ /etc/systemd/journald.conf 2>/dev/null | grep -c . || true"
    expect_int: ">= 1"

  - id: ir-02-rsyslog-enabled
    description: Log collection is running for incident telemetry
    command: "systemctl is-active rsyslog"
    expect_output: "active"

  - id: ir-02-logs-perms
    description: Log files are not readable by ordinary users
    command: |
      # The exposure that matters is access by users outside the owning group,
      # or group *write*. A root:root file at 0640 is not readable by any
      # ordinary user, so it is not flagged.
      find /var/log -maxdepth 1 -type f \( -perm /007 -o -perm /020 \) 2>/dev/null | head -5
    expect_empty: true

# ===========================================================================
# 03.07 MAINTENANCE
# ===========================================================================
  - id: ma-04-audit-maint-tools
    description: Use of maintenance tools is audited
    command: |
      # auditctl renders watch rules as `-k <key>` and syscall rules as
      # `key=<key>`; both forms must count.
      auditctl -l 2>/dev/null | grep -cE '(-k|key=) ?maintenance([[:space:]]|$)' || true
    expect_int: ">= 2"

  - id: ma-04-scanner-present
    description: Media introduced for maintenance can be scanned
    command: "command -v clamscan >/dev/null && echo present"
    expect_output: "present"
    manual_if_absent: true

  - id: ma-05-ssh-session-audit
    description: Remote maintenance sessions are audited
    command: |
      # auditctl renders watch rules as `-k <key>` and syscall rules as
      # `key=<key>`; both forms must count.
      auditctl -l 2>/dev/null | grep -cE '(-k|key=) ?session([[:space:]]|$)' || true
    expect_int: ">= 2"

  - id: ma-05-ssh-idle-terminate
    description: Maintenance sessions terminate when complete or idle
    command: "sshd -T 2>/dev/null | awk '/^clientaliveinterval/ {print $2}'"
    expect_int: "<= {odp.ssh_client_alive_interval}"

  - id: ma-05-no-telnet-rsh
    description: No unauthenticated remote maintenance path exists
    command: "rpm -qa telnet-server rsh-server tigervnc-server 2>/dev/null"
    expect_empty: true

# ===========================================================================
# 03.08 MEDIA PROTECTION
# ===========================================================================
  - id: mp-02-cui-path-mode
    description: The CUI path restricts access to its authorized group
    command: "stat -c '%a' /var/lib/cui 2>/dev/null"
    expect_match: "^(770|750|700|2770)$"

  - id: mp-02-home-perms
    description: Home directories are not accessible to other users
    command: |
      awk -F: '($3>=1000 && $3!=65534){print $6}' /etc/passwd | while read -r h; do
        [ -d "$h" ] || continue
        m=$(stat -c %a "$h"); [ "$m" -gt 700 ] && echo "$h:$m"
      done
    expect_empty: true

  - id: mp-02-umask-profile
    description: New files are created without group or other access
    command: "grep -rhoP '(?<=^umask )\\d+' /etc/profile.d/ /etc/profile 2>/dev/null | sort | tail -1"
    expect_match: "^0?77$"

  - id: mp-02-no-world-readable-home
    description: No home directory is world-readable
    command: |
      awk -F: '($3>=1000 && $3!=65534){print $6}' /etc/passwd | while read -r h; do
        [ -d "$h" ] && find "$h" -maxdepth 0 -perm /007 2>/dev/null
      done
    expect_empty: true

  - id: mp-03-sanitize-tools
    description: Media sanitization tooling is available
    command: |
      for t in shred wipefs blkdiscard; do command -v $t >/dev/null || echo missing-$t; done
    expect_empty: true

  - id: mp-03-luks-present
    description: Cryptographic erase is available via LUKS volumes
    command: "lsblk -o TYPE 2>/dev/null | grep -c crypt"
    expect_int: ">= 1"

  - id: mp-07-usb-storage-blocked
    description: The USB storage driver cannot be loaded
    command: "modprobe -n -v usb-storage 2>&1 | head -1"
    expect_match: "(install /bin/false|not found|blacklist)"

  - id: mp-07-usb-storage-not-loaded
    description: The USB storage driver is not currently loaded
    command: "lsmod | grep -c '^usb_storage' || true"
    expect_int: "== 0"

  - id: mp-07-autofs-masked
    description: The automounter is masked
    command: "systemctl is-enabled autofs 2>&1"
    expect_match: "(masked|disabled|not-found|No such file)"

  - id: mp-07-automount-disabled
    description: Removable media does not automount
    command: "test -f /etc/udev/rules.d/80-nist-no-automount.rules && echo present"
    expect_output: "present"

  - id: mp-09-luks-cipher
    description: Encrypted volumes use an approved cipher
    command: |
      for d in $(lsblk -pnlo NAME,TYPE | awk '$2=="lvm"{print $1}'); do
        cryptsetup isLuks "$d" 2>/dev/null || continue
        cryptsetup luksDump "$d" 2>/dev/null | awk '/cipher:/ {print $2}'
      done | sort -u | head -1
    expect_match: "aes-xts"

  - id: mp-09-backup-path-perms
    description: The backup staging path restricts access
    command: "stat -c '%a' /var/backups/cui 2>/dev/null"
    expect_match: "^(770|750|700|2770)$"

