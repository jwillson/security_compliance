# ===========================================================================
# 03.10 PHYSICAL PROTECTION
# ===========================================================================
  - id: pe-07-grub-password
    description: Boot parameters cannot be edited without authentication
    command: |
      # The password may live in user.cfg or be emitted by 01_users; on an EFI
      # install the generated config is under /boot/efi.
      cat /boot/grub2/user.cfg /etc/grub.d/01_users \
          /boot/efi/EFI/rocky/user.cfg 2>/dev/null \
        | grep -c 'password_pbkdf2' || echo 0
    expect_int: ">= 1"

  - id: pe-07-grub-cfg-perms
    description: The boot configuration is not readable by ordinary users
    command: |
      for f in /boot/grub2/grub.cfg /boot/efi/EFI/rocky/grub.cfg; do
        [ -f "$f" ] && stat -c '%a' "$f"
      done | sort -n | tail -1
    expect_match: "^(600|0600|700)$"

  - id: pe-07-single-user-auth
    description: Single-user mode requires the root password
    command: "grep -c 'sulogin' /usr/lib/systemd/system/rescue.service"
    expect_int: ">= 1"

  - id: pe-07-emergency-auth
    description: Emergency mode requires the root password
    command: "grep -c 'sulogin' /usr/lib/systemd/system/emergency.service"
    expect_int: ">= 1"

  - id: pe-07-ctrlaltdel-disabled
    description: Console key sequence cannot reboot the host
    command: "systemctl is-enabled ctrl-alt-del.target 2>&1"
    expect_match: "(masked|not-found|No such file)"

