  - id: cm-10-inventory-timer
    description: The inventory refreshes on a schedule
    command: "systemctl is-enabled nist-inventory.timer 2>&1"
    expect_output: "enabled"

  - id: cm-10-inventory-fresh
    description: The inventory is not stale (updated within 8 days)
    command: "echo $(( ( $(date +%s) - $(stat -c %Y /etc/nist-800-171/component-inventory.json 2>/dev/null || echo 0) ) / 86400 ))"
    expect_int: "<= 8"

  - id: cm-10-dnf-hook
    description: The inventory updates on every package transaction
    command: "test -f /etc/dnf/plugins/post-transaction-actions.d/nist-inventory.action && echo present"
    expect_output: "present"

  - id: cm-11-cui-path-exists
    description: The designated CUI location exists
    command: "test -d /var/lib/cui && echo present"
