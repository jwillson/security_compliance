    expect_int: ">= {odp.password_difok}"

  - id: ia-07-maxrepeat
    description: Runs of the same character are limited
    command: "grep -oP '(?<=^maxrepeat\\s=\\s)\\d+|(?<=^maxrepeat=)\\d+' /etc/security/pwquality.conf | head -1"
    expect_int: "<= {odp.password_max_repeat}"

  - id: ia-07-maxclassrepeat
    description: Runs of the same character class are limited
    command: "grep -oP '(?<=^maxclassrepeat\\s=\\s)\\d+|(?<=^maxclassrepeat=)\\d+' /etc/security/pwquality.conf | head -1"
    expect_int: "<= {odp.password_max_class_repeat}"

  - id: ia-07-minclass
    description: Passwords use the ODP number of character classes
    command: "grep -oP '(?<=^minclass\\s=\\s)\\d+|(?<=^minclass=)\\d+' /etc/security/pwquality.conf | head -1"
    expect_int: ">= {odp.password_min_classes}"

  - id: ia-07-dictcheck
    description: Passwords are checked against a dictionary of known passwords
    command: "grep -oP '(?<=^dictcheck\\s=\\s)\\d+|(?<=^dictcheck=)\\d+' /etc/security/pwquality.conf | head -1"
    expect_int: "== 1"

  - id: ia-07-pwhistory-remember
    description: Previous passwords cannot be reused
    command: "grep -rhoP '(?<=remember\\s=\\s)\\d+|(?<=remember=)\\d+' /etc/security/pwhistory.conf /etc/pam.d/system-auth 2>/dev/null | sort -rn | head -1"
