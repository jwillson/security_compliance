  - id: au-06-audit-log-not-writable
    description: Audit logs cannot be modified by non-root users
    command: "find /var/log/audit -type f ! -user root -o -type f -perm /077 2>/dev/null | head -5"
    expect_empty: true

  - id: au-07-chronyd-enabled
