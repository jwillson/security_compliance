# ===========================================================================
# 03.05 IDENTIFICATION AND AUTHENTICATION
# ===========================================================================
  - id: ia-01-no-duplicate-uid
    description: No two accounts share a UID
    command: "awk -F: '{print $3}' /etc/passwd | sort | uniq -d"
    expect_empty: true

  - id: ia-01-no-duplicate-user
    description: No two entries share a user name
    command: "awk -F: '{print $1}' /etc/passwd | sort | uniq -d"
    expect_empty: true

  - id: ia-01-no-duplicate-gid
    description: No two groups share a GID
    command: "awk -F: '{print $3}' /etc/group | sort | uniq -d"
    expect_empty: true

  - id: ia-01-no-empty-passwd
    description: No account authenticates with an empty password
    command: "awk -F: '($2==\"\"){print $1}' /etc/shadow"
    expect_empty: true

  - id: ia-01-loginuid-immutable
    description: Session identity cannot be changed after login
    command: |
      # The running kernel is authoritative: a rules.d fragment may exist
      # without ever having been loaded.
      auditctl -s 2>/dev/null | grep -c 'loginuid_immutable 1' || true
    expect_int: ">= 1"

  - id: ia-01-no-nullok
    description: The PAM stack does not permit empty passwords
    command: "grep -l nullok /etc/pam.d/system-auth /etc/pam.d/password-auth 2>/dev/null"
    expect_empty: true

  - id: ia-01-no-plus-entries
    description: No NIS-style wildcard entries exist in the identity databases
    command: "grep -h '^+' /etc/passwd /etc/shadow /etc/group 2>/dev/null"
    expect_empty: true

  - id: ia-02-host-keys-exist
    description: The host has a cryptographic device identity
    command: "ls /etc/ssh/ssh_host_*_key 2>/dev/null | wc -l"
    expect_int: ">= 1"

  - id: ia-02-host-key-perms
    description: Host private keys are readable only by root
    command: "find /etc/ssh -name 'ssh_host_*_key' ! -perm 0600 2>/dev/null"
    expect_empty: true

  - id: ia-02-ssh-stricthostkey
    description: Outbound connections verify the peer's identity
    command: |
      # ssh honours the FIRST value it reads and the drop-in dir is included
      # before the stock defaults, so read the managed file, not the default.
      awk 'tolower($1)=="stricthostkeychecking" {print tolower($2); exit}' \
        /etc/ssh/ssh_config.d/00-nist-800-171.conf 2>/dev/null
    expect_output: "yes"

  - id: ia-03-sshd-authmethods
    description: Remote access requires more than one authentication factor
    command: "sshd -T 2>/dev/null | awk '/^authenticationmethods/ {print $2}'"
    expect_match: "publickey.*password|password.*publickey"
    manual_if_absent: true

  - id: ia-03-pkcs11-installed
    description: Smart card (PIV/CAC) support is available
    command: "rpm -q opensc >/dev/null && echo present"
    expect_output: "present"
    manual_if_absent: true

  - id: ia-03-sssd-installed
    description: Directory-backed authentication support is available
    command: "rpm -q sssd >/dev/null && echo present"
    expect_output: "present"
    manual_if_absent: true

  - id: ia-03-sshd-no-password-only
    description: A password alone cannot establish a remote session
    command: "sshd -T 2>/dev/null | awk '/^authenticationmethods/ {print $2}'"
    expect_no_match: "^(any|password)$"

  - id: ia-04-sshd-kex
    description: Only approved key exchange algorithms are offered
    command: "sshd -T 2>/dev/null | awk '/^kexalgorithms/ {print $2}'"
    expect_no_match: "diffie-hellman-group1-sha1|diffie-hellman-group14-sha1|gss-"

  - id: ia-04-sshd-ciphers
    description: Only approved ciphers are offered
    command: "sshd -T 2>/dev/null | awk '/^ciphers/ {print $2}'"
    expect_no_match: "3des|arcfour|blowfish|cast128|-cbc"

  - id: ia-04-sshd-macs
    description: Only strong MAC algorithms are offered
    command: "sshd -T 2>/dev/null | awk '/^macs/ {print $2}'"
    expect_no_match: "md5|ripemd|umac-64[^-]|hmac-sha1$|hmac-sha1,"

  - id: ia-04-crypto-policy-set
    description: The system-wide crypto policy matches the ODP
    command: "update-crypto-policies --show 2>/dev/null"
    expect_match: "^{odp.crypto_policy}"

  - id: ia-04-rekey-limit
    description: SSH sessions rekey on a bounded interval
    command: "sshd -T 2>/dev/null | awk '/^rekeylimit/ {print $3}'"
    expect_int: "<= 3600"

  - id: ia-05-uid-min
    description: Human identifiers start above the system range
    command: "awk '/^\\s*UID_MIN/ {print $2}' /etc/login.defs"
    expect_int: ">= 1000"

  - id: ia-05-gid-min
    description: Human group identifiers start above the system range
    command: "awk '/^\\s*GID_MIN/ {print $2}' /etc/login.defs"
    expect_int: ">= 1000"

  - id: ia-05-sys-uid-range
    description: A distinct system identifier range is defined
    command: "awk '/^\\s*SYS_UID_MAX/ {print $2}' /etc/login.defs"
    expect_int: "<= 999"

  - id: ia-05-no-uid-reuse
    description: No identifier is shared between accounts (reuse prevention)
    command: "awk -F: '{print $3}' /etc/passwd | sort | uniq -d"
    expect_empty: true

  - id: ia-05-create-home
    description: Accounts receive a home directory on creation
    command: "awk '/^\\s*CREATE_HOME/ {print tolower($2)}' /etc/login.defs"
