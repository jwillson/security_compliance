[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
# Host keys are verified. OpenSSH refuses to send a password to an unverified
# host, and the password is the second MFA factor (03.05.03), so disabling this
# would break authentication rather than merely relax it. lib/ssh-env.sh seeds
# known_hosts before connecting.
host_key_checking    = True
retry_files_enabled  = False
result_format        = yaml
display_skipped_hosts = False
interpreter_python   = /usr/bin/python3
forks                = 10
timeout              = 60

[ssh_connection]
pipelining = True
# Both factors must be offered: a host hardened for 03.05.03 requires
# `publickey,password`, so restricting this to publickey alone authenticates
# only partially and the connection is refused. The password factor comes from
# SSH_ASKPASS (see lib/ssh-env.sh).
# Ansible appends its own `-o PasswordAuthentication=no` further along the
# command line. OpenSSH honours the FIRST occurrence of an option, so these
# must be set here to win.
# StrictHostKeyChecking=yes: every tool records the host key before it
# connects (lib/ssh-env.sh, tools/lab-ssh.sh, vm/build-vm.sh), so an unknown
# key is refused at once. Left at "ask", the question goes to SSH_ASKPASS,
# whose answer is a password rather than "yes", and ssh asks again without
# end (DEFECTS 7.23).
ssh_args = -o ControlMaster=auto -o ControlPersist=120s
           -o StrictHostKeyChecking=yes
           -o PreferredAuthentications=publickey,password
           -o PasswordAuthentication=yes
           -o KbdInteractiveAuthentication=yes
           -o NumberOfPasswordPrompts=1

[privilege_escalation]
become        = True
become_method = sudo
