---
# NIST SP 800-171r3 Linux overlay — generated by nistctl from catalog.json
# Target: Rocky Linux 9 / RHEL 9 family. Review ODPs. Do not apply blindly.
#
#   ansible-galaxy collection install -r ansible/requirements.yml
#   ansible-playbook -i ansible/inventory.ini ansible/site.yml --check
#   ansible-playbook -i ansible/inventory.ini ansible/site.yml --tags 03.01.08

- name: nistctl 800-171r3 overlay
  hosts: cui
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../odps.yml"
  tasks:
    - name: "03.01.01 Account Management — Set INACTIVE"
      tags: [03.01.01, AC, os]
      ansible.builtin.lineinfile:
        path: /etc/default/useradd
        regexp: ^INACTIVE=
        line: "INACTIVE={{ odp.inactive_days }}"

    - name: "03.01.01 Account Management — Readonly TMOUT"
      tags: [03.01.01, AC, os]
      ansible.builtin.copy:
        dest: /etc/profile.d/tmout.sh
        content: |
          TMOUT={{ odp.idle_seconds }}
          readonly TMOUT
          export TMOUT

    - name: "03.01.02 Access Enforcement — Set umask 027"
      tags: [03.01.02, AC, os]
      ansible.builtin.lineinfile:
        path: /etc/profile.d/umask.sh
        line: umask 027

    - name: "03.01.02 Access Enforcement — SELinux enforcing"
      tags: [03.01.02, AC, os]
      ansible.posix.selinux:
        state: enforcing
        policy: targeted

    - name: "03.01.03 Information Flow Enforcement — Enable firewalld"
      tags: [03.01.03, AC, os]
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: "03.01.03 Information Flow Enforcement — anti-spoof"
      tags: [03.01.03, AC, os]
      ansible.posix.sysctl:
        name: net.ipv4.conf.all.rp_filter
        value: 1

    - name: "03.01.04 Separation of Duties — Create audit group"
      tags: [03.01.04, AC, os_partial]
      ansible.builtin.group:
        name: audit
        system: true

    - name: "03.01.05 Least Privilege — Drop NOPASSWD"
      tags: [03.01.05, AC, os]
      ansible.builtin.replace:
        path: /etc/sudoers
        regexp: "NOPASSWD:\\s*ALL"
        replace: ALL

    - name: "03.01.06 Least Privilege – Privileged Accounts — Disable root SSH"
      tags: [03.01.06, AC, os]
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/50-nist.conf
        line: PermitRootLogin no

    - name: "03.01.07 Least Privilege – Privileged Functions — sudo logfile"
      tags: [03.01.07, AC, os]
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/00-logging
        line: Defaults logfile=/var/log/sudo.log

    - name: "03.01.07 Least Privilege – Privileged Functions — audit privileged"
      tags: [03.01.07, AC, os]
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/30-priv.rules
        src: "{{ playbook_dir }}/files/audit-priv.rules"

    - name: "03.01.08 Unsuccessful Logon Attempts — Configure faillock"
      tags: [03.01.08, AC, os]
      ansible.builtin.blockinfile:
        path: /etc/security/faillock.conf
        block: |
          deny = {{ odp.faillock_deny }}
          fail_interval = {{ odp.faillock_interval }}
          unlock_time = {{ odp.faillock_unlock }}

    - name: "03.01.09 System Use Notification — Write banner"
      tags: [03.01.09, AC, os]
      ansible.builtin.copy:
        dest: /etc/issue
        content: |
          {{ odp.banner }}

    - name: "03.01.09 System Use Notification — sshd Banner"
      tags: [03.01.09, AC, os]
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/50-nist.conf
        line: Banner /etc/issue.net

    - name: "03.01.10 Device Lock — IdleAction lock"
      tags: [03.01.10, AC, os]
      community.general.ini_file:
        path: /etc/systemd/logind.conf
        section: Login
        option: IdleAction
        value: lock

    - name: "03.01.10 Device Lock — IdleActionSec"
      tags: [03.01.10, AC, os]
      community.general.ini_file:
        path: /etc/systemd/logind.conf
        section: Login
        option: IdleActionSec
        value: "{{ odp.idle_seconds }}"

    - name: "03.01.11 Session Termination — ClientAlive"
      tags: [03.01.11, AC, os]
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config.d/50-nist.conf
        block: |
          ClientAliveInterval {{ odp.client_alive }}
          ClientAliveCountMax 2

    - name: "03.01.12 Remote Access — Lock SSH"
      tags: [03.01.12, AC, os]
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config.d/50-nist.conf
        block: |
          AllowGroups wheel
          GatewayPorts no
          PermitRootLogin no
          MaxAuthTries {{ odp.max_auth_tries }}

    - name: "03.01.16 Wireless Access — Disable wifi"
      tags: [03.01.16, AC, os]
      ansible.builtin.command:
        cmd: nmcli radio wifi off

    - name: "03.01.16 Wireless Access — Blacklist bluetooth"
      tags: [03.01.16, AC, os]
      ansible.builtin.copy:
        dest: /etc/modprobe.d/nist-wireless.conf
        content: |
          blacklist bluetooth
          blacklist btusb

    - name: "03.01.18 Access Control for Mobile Devices — usbguard"
      tags: [03.01.18, AC, os_partial]
        # Requires a device policy; do not enable blindly on desktops that need HID.
      ansible.builtin.service:
        name: usbguard
        state: started
        enabled: true

    - name: "03.01.20 Use of External Systems — hosts.allow localhost"
      tags: [03.01.20, AC, os_partial]
      ansible.builtin.copy:
        dest: /etc/hosts.allow
        content: |
          sshd: {{ odp.ssh_allow_cidrs }}

    - name: "03.03.01 Event Logging — enable auditd"
      tags: [03.03.01, AU, os]
      ansible.builtin.service:
        name: auditd
        state: started
        enabled: true

    - name: "03.03.01 Event Logging — STIG-like rules"
      tags: [03.03.01, AU, os]
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/10-nist.rules
        src: "{{ playbook_dir }}/files/audit-nist.rules"

    - name: "03.03.02 Audit Record Content — ENRICHED"
      tags: [03.03.02, AU, os]
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: ^log_format
        line: log_format = ENRICHED

    - name: "03.03.03 Audit Record Generation — max_log_file"
      tags: [03.03.03, AU, os]
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: ^max_log_file 
        line: max_log_file = 50

    - name: "03.03.03 Audit Record Generation — num_logs"
      tags: [03.03.03, AU, os]
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: ^num_logs
        line: num_logs = 8

    - name: "03.03.04 Response to Audit Logging Process Failures — space_left_action"
      tags: [03.03.04, AU, os]
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: ^space_left_action
        line: space_left_action = SYSLOG

    - name: "03.03.04 Response to Audit Logging Process Failures — admin_space_left_action"
      tags: [03.03.04, AU, os]
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: ^admin_space_left_action
        line: admin_space_left_action = SUSPEND

    - name: "03.03.05 Audit Record Review, Analysis, and Reporting — Forward audit"
      tags: [03.03.05, AU, os_partial]
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/30-audit.conf
        content: |
          if $programname == 'audit' then @@{{ odp.syslog_server }}

    - name: "03.03.07 Time Stamps — enable chrony"
      tags: [03.03.07, AU, os]
      ansible.builtin.service:
        name: chronyd
        state: started
        enabled: true

    - name: "03.03.07 Time Stamps — UTC"
      tags: [03.03.07, AU, os]
      community.general.timezone:
        name: UTC

    - name: "03.03.08 Protection of Audit Information — audit.log mode"
      tags: [03.03.08, AU, os]
      ansible.builtin.file:
        path: /var/log/audit
        owner: root
        group: root
        mode: 0750

    - name: "03.04.01 Baseline Configuration — aide --init"
      tags: [03.04.01, CM, os_partial]
      ansible.builtin.command:
        cmd: "aide --init && mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz"

    - name: "03.04.02 Configuration Settings — FIPS crypto-policies"
      tags: [03.04.02, CM, os]
      ansible.builtin.command:
        cmd: update-crypto-policies --set FIPS

    - name: "03.04.03 Configuration Change Control — install etckeeper"
      tags: [03.04.03, CM, os_partial]
      ansible.builtin.dnf:
        name: etckeeper
        state: present

    - name: "03.04.05 Access Restrictions for Change — fix world-writable"
      tags: [03.04.05, CM, os]
      ansible.builtin.command:
        cmd: chmod o-w /etc/passwd /etc/group /etc/shadow

    - name: "03.04.06 Least Functionality — remove legacy daemons"
      tags: [03.04.06, CM, os]
      ansible.builtin.dnf:
        name:
          - telnet
          - rsh
          - ypserv
          - tftp
          - talk
        state: absent

    - name: "03.04.06 Least Functionality — mask cups if unused"
      tags: [03.04.06, CM, os]
      ansible.builtin.systemd:
        name: cups
        enabled: false
        masked: true

    - name: "03.04.08 Authorized Software – Allow by Exception — enable fapolicyd"
      tags: [03.04.08, CM, os]
        # Tune allowlists before enforcing on production.
      ansible.builtin.service:
        name: fapolicyd
        state: started
        enabled: true

    - name: "03.04.10 System Component Inventory — write inventory"
      tags: [03.04.10, CM, os]
      ansible.builtin.shell:
        cmd: "mkdir -p /var/lib/nist && rpm -qa --qf '%{NAME}|%{VERSION}|%{RELEASE}\\n' > /var/lib/nist/inventory.txt"

    - name: "03.04.11 Information Location — CUI locations file"
      tags: [03.04.11, CM, os_partial]
      ansible.builtin.copy:
        dest: /etc/cui-locations
        content: |
          /srv/cui

    - name: "03.05.01 User Identification and Authentication — UsePAM yes"
      tags: [03.05.01, IA, os]
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/50-nist.conf
        line: UsePAM yes

    - name: "03.05.03 Multi-Factor Authentication — authselect sssd with-faillock"
      tags: [03.05.03, IA, os]
        # Wire a FIPS authenticator (PIV, IPA OTP, FIDO2), not google-authenticator.
      ansible.builtin.command:
        cmd: authselect select sssd with-faillock --force

    - name: "03.05.04 Replay-Resistant Authentication — prefer keys"
      tags: [03.05.04, IA, os]
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config.d/50-nist.conf
        block: |
          PubkeyAuthentication yes
          KbdInteractiveAuthentication yes

    - name: "03.05.07 Password Management — pwquality"
      tags: [03.05.07, IA, os]
      ansible.builtin.blockinfile:
        path: /etc/security/pwquality.conf
        block: |
          minlen = {{ odp.password_min_len }}
          dictcheck = 1
          minclass = 4

    - name: "03.05.07 Password Management — remember old hashes"
      tags: [03.05.07, IA, os]
      ansible.builtin.lineinfile:
        path: /etc/security/pwhistory.conf
        line: remember = 5

    - name: "03.05.11 Authentication Feedback — sshd INFO"
      tags: [03.05.11, IA, os]
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/50-nist.conf
        line: LogLevel INFO

    - name: "03.05.12 Authenticator Management — PermitEmptyPasswords no"
      tags: [03.05.12, IA, os_partial]
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/50-nist.conf
        line: PermitEmptyPasswords no

    - name: "03.06.01 Incident Handling — fail2ban"
      tags: [03.06.01, IR, os_partial]
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    - name: "03.06.02 Incident Monitoring, Reporting, and Response Assistance — incident dir"
      tags: [03.06.02, IR, os_partial]
      ansible.builtin.file:
        path: /var/log/incidents
        state: directory
        mode: 0750

    - name: "03.07.05 Nonlocal Maintenance — Match group maint"
      tags: [03.07.05, MA, os]
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config.d/60-maint.conf
        block: Match Group maint\n  ForceCommand /usr/sbin/nologin\n  AllowTcpForwarding no\n

    - name: "03.07.06 Maintenance Personnel — maint list"
      tags: [03.07.06, MA, os_partial]
      ansible.builtin.copy:
        dest: /etc/nist/maint-personnel.list
        content: "# uid, org, until\\n"

    - name: "03.08.03 Media Sanitization — document wipe procedure"
      tags: [03.08.03, MP, os]
      ansible.builtin.copy:
        dest: /usr/local/sbin/nist-sanitize
        src: "{{ playbook_dir }}/files/nist-sanitize.sh"
        mode: 0750

    - name: "03.08.07 Media Use — optional usb_storage blacklist"
      tags: [03.08.07, MP, os]
        # Skip on admin jump hosts that need USB.
      ansible.builtin.copy:
        dest: /etc/modprobe.d/nist-usb.conf
        content: install usb_storage /bin/true\n

    - name: "03.08.09 System Backup – Cryptographic Protection — backup policy stub"
      tags: [03.08.09, MP, os]
      ansible.builtin.copy:
        dest: /etc/nist/backup.yml
        content: "method: restic\\nencrypted: true\\n"

    - name: "03.09.02 Personnel Termination and Transfer — offboard helper"
      tags: [03.09.02, PS, os]
      ansible.builtin.copy:
        dest: /usr/local/sbin/nist-offboard
        src: "{{ playbook_dir }}/files/nist-offboard.sh"
        mode: 0750

    - name: "03.11.02 Vulnerability Monitoring and Scanning — dnf-automatic"
      tags: [03.11.02, RA, os]
      ansible.builtin.service:
        name: dnf-automatic.timer
        enabled: true
        state: started

    - name: "03.12.03 Continuous Monitoring — aide timer"
      tags: [03.12.03, CA, os_partial]
      ansible.builtin.copy:
        dest: /etc/systemd/system/aide.timer
        src: "{{ playbook_dir }}/files/aide.timer"

    - name: "03.12.05 Information Exchange — exchange dir"
      tags: [03.12.05, CA, os_partial]
      ansible.builtin.file:
        path: /etc/nist/exchanges
        state: directory

    - name: "03.13.01 Boundary Protection — default public"
      tags: [03.13.01, SC, os]
      ansible.builtin.command:
        cmd: firewall-cmd --set-default-zone=public

    - name: "03.13.04 Information in Shared System Resources — object reuse sysctls"
      tags: [03.13.04, SC, os]
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-nist-sc.conf
        content: kernel.dmesg_restrict = 1\nkernel.kptr_restrict = 2\nkernel.yama.ptrace_scope = 1\n

    - name: "03.13.06 Network Communications – Deny by Default – Allow by Exception — DROP target"
      tags: [03.13.06, SC, os]
      ansible.builtin.command:
        cmd: "firewall-cmd --permanent --zone=public --set-target=DROP && firewall-cmd --reload"

    - name: "03.13.08 Transmission and Storage Confidentiality — fips=1"
      tags: [03.13.08, SC, os]
        # Requires reboot.
      ansible.builtin.command:
        cmd: fips-mode-setup --enable

    - name: "03.13.08 Transmission and Storage Confidentiality — FIPS sshd"
      tags: [03.13.08, SC, os]
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config.d/50-nist.conf
        block: "Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com\\nMACs hmac-sha2-256,hmac-sha2-512\\nKexAlgorithms ecdh-sha2-nistp256,ecdh-sha2-nistp384\\n"

    - name: "03.13.09 Network Disconnect — ClientAlive"
      tags: [03.13.09, SC, os]
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/50-nist.conf
        line: "ClientAliveInterval {{ odp.client_alive }}"

    - name: "03.13.10 Cryptographic Key Establishment and Management — host key perms"
      tags: [03.13.10, SC, os]
      ansible.builtin.file:
        path: /etc/ssh
        mode: 0755

    - name: "03.13.11 Cryptographic Protection — set FIPS"
      tags: [03.13.11, SC, os]
      ansible.builtin.command:
        cmd: update-crypto-policies --set FIPS

    - name: "03.13.12 Collaborative Computing Devices and Applications — blacklist camera"
      tags: [03.13.12, SC, os]
      ansible.builtin.copy:
        dest: /etc/modprobe.d/nist-collab.conf
        content: blacklist uvcvideo\nblacklist snd_usb_audio\n

    - name: "03.13.15 Session Authenticity — RekeyLimit"
      tags: [03.13.15, SC, os]
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/50-nist.conf
        line: RekeyLimit 1G 1h

    - name: "03.14.01 Flaw Remediation — dnf-automatic apply"
      tags: [03.14.01, SI, os]
      ansible.builtin.lineinfile:
        path: /etc/dnf/automatic.conf
        regexp: ^apply_updates
        line: apply_updates = yes

    - name: "03.14.02 Malicious Code Protection — install clamav"
      tags: [03.14.02, SI, os]
      ansible.builtin.dnf:
        name:
          - clamav
          - clamav-update
        state: present

    - name: "03.14.02 Malicious Code Protection — freshclam"
      tags: [03.14.02, SI, os]
      ansible.builtin.service:
        name: clamav-freshclam
        enabled: true
        state: started

    - name: "03.14.06 System Monitoring — aide init"
      tags: [03.14.06, SI, os]
      ansible.builtin.command:
        cmd: aide --init
