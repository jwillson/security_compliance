---
# NIST SP 800-171r3 Full Configuration Variables

# 3.1 Access Control
ac_idle_timeout_seconds: 900          # FIXED (was ac_idle_timeout)
ac_banner_text: "Authorized uses only. All activity monitored."
ac_max_auth_tries: 3
ac_ssh_client_alive_interval: 900     # FIXED (was ac_client_alive_interval)
ac_ssh_client_alive_count: 0          # FIXED (was ac_client_alive_count)
ac_permit_root_login: "no"
ac_lock_time: 900
ac_deny_threshold: 3

# 3.3 Audit & Accountability
audit_arch_map:
  x86_64: "c000003e"
  aarch64: "c00000b7"
audit_log_max_size_mb: 50             # FIXED (was audit_log_max_size)
audit_disk_full_action: "SUSPEND"
audit_ntp_servers:
  - "0.pool.ntp.org"
  - "1.pool.ntp.org"

# 3.4 Configuration Management
unwanted_packages:
  - "telnet"
  - "rsh-server"
  - "ypserv"
  - "tftp-server"

disabled_modules:                     # FIXED (was blacklisted_modules)
  - "usb_storage"
  - "cramfs"
  - "freevxfs"
  - "jffs2"
  - "hfs"
  - "hfsplus"
  - "squashfs"
  - "udf"
  - "uvcvideo"

# 3.5 Identification & Auth
password_min_len: 14
password_min_class: 4
mfa_package: "google-authenticator"

# 3.13 System & Communications
ssh_ciphers: "aes256-gcm@openssh.com,aes128-gcm@openssh.com"
ssh_macs: "hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com"
sysctl_settings:
  - { name: "net.ipv4.ip_forward", value: "0" }
  - { name: "net.ipv4.conf.all.accept_redirects", value: "0" }
  - { name: "net.ipv4.conf.all.rp_filter", value: "1" }
  - { name: "net.ipv4.tcp_syncookies", value: "1" }
  - { name: "net.ipv4.conf.all.log_martians", value: "1" }

# 3.14 System Integrity
security_packages: ["aide", "clamav", "clamav-update", "openscap-scanner", "audit", "chrony"]
